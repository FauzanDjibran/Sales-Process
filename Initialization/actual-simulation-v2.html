table.grid.stm td.stn .cd{font-family:var(--f-mono);font-size:11px;font-weight:700;color:var(--muted-2)}
table.grid.stm td.stn .tgl{width:18px;height:18px;flex:0 0 auto;border:0;background:transparent;padding:0;
  display:grid;place-items:center;border-radius:4px;color:var(--muted);cursor:pointer}
table.grid.stm td.stn span.tgl{cursor:default}
table.grid.stm td.stn button.tgl:hover{background:var(--line-2);color:var(--brand)}
table.grid.stm td.stn .chev{display:grid;place-items:center;transition:transform .14s}
table.grid.stm td.stn .chev.o{transform:rotate(90deg)}
table.grid.stm td.stn.d1{padding-left:25px}
table.grid.stm td.stn.d2{padding-left:39px}
table.grid.stm td.stn.d3{padding-left:53px}
table.grid.stm td.stn.d4{padding-left:67px}
table.grid.stm td.stn.d5{padding-left:81px}
table.grid.stm td.stn.d6{padding-left:95px}
table.grid.stm tr.st-step td{background:var(--line-3)}
table.grid.stm tr.st-step td.stn .nm{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
table.grid.stm tr.st-cat td.stn .nm{font-weight:700;color:var(--ink)}
table.grid.stm tr.st-sub td.stn .nm{font-weight:600;color:var(--ink-2)}
table.grid.stm tr.st-par td{color:var(--muted)}
table.grid.stm tr.st-par td.stn .nm{font-size:11.5px}
table.grid.stm tr.st-res td.stn .nm{text-transform:uppercase;letter-spacing:.04em}
table.grid thead th .rsub{display:block;margin-top:2px;font-family:var(--f-mono);font-size:9.5px;
  font-weight:600;letter-spacing:.02em;text-transform:none;color:var(--muted-2)}
/* A statement's own title: what it is, for whom, over when, and when it was
   read — two compact lines, so a screenshot cannot be mistaken for another run
   and the sticky header above keeps its room. */

   replaced; this note is why they read the way they do.

   Three things used to pay for a form's height. A field cost 89px to present a
   34px control: 14px of its own padding, 20px of label, and 21px of help
   *beneath* the control. The row was hard-wired to two equal columns, so a date
   picker sat in a 500px box, every third field started a new row, and the
   pointer crossed ~570px between two controls that each needed 180px. And the
   card body's 16px padding was doubled by the row's own.

   So the help moved onto the label row — no height at all, and still read
   without hovering — the row became a 12-column grid that each field spans, and
   the padding is paid once, by `.fbody`. A Budget create form went from 704px
   to 390px. The 34px control height is deliberately untouched: these operators
   work by mouse, and a smaller target would cost them more than the pixels are

   The one formatting module (convention P12): dates dd/mm/yyyy, '.' groups

const MONTHS = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

  pad2: (n) => String(n).padStart(2, '0'),
  date(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.slice(0, 10).split('-');
    return `${d}/${m}/${y}`;
  },
  ts(iso) { return iso ? `${fmt.date(iso)} • ${iso.slice(11, 16)}` : ''; },
  num(n, dec = 0) {
    return Number(n || 0).toLocaleString('id-ID', { minimumFractionDigits: dec, maximumFractionDigits: dec });
  },
  money(n) { return (n < 0 ? '− Rp ' : 'Rp ') + fmt.num(Math.abs(n)); },
  /** DPP Nilai Lain keeps its cents — it is 11/12 of a whole-rupiah DPP. */
  money2(n) { return 'Rp ' + fmt.num(n, 2); },
  pct(n) { return fmt.num(n, Number.isInteger(n) ? 0 : 2) + '%'; },
  qty(n, uom) { return fmt.num(n) + (uom ? ' ' + uom : ''); },
  /** dd/mm/yyyy -> yyyy-mm-dd, '' when the text is not a real calendar date. */
  toIso(display) {
    const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec((display || '').trim());
    if (!m) return '';
    const d = Number(m[1]), mo = Number(m[2]), y = Number(m[3]);
    if (mo < 1 || mo > 12 || d < 1) return '';
    if (d > new Date(Date.UTC(y, mo, 0)).getUTCDate()) return '';
    return `${y}-${fmt.pad2(mo)}-${fmt.pad2(d)}`;
  },
  /** Typing mask for a date field: digits only, slashes inserted. */
  mask(raw) {
    const d = raw.replace(/\D/g, '').slice(0, 8);
    return [d.slice(0, 2), d.slice(2, 4), d.slice(4, 8)].filter(Boolean).join('/');
  },
  addDays(iso, n) {
    const d = new Date(iso + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  },
  /** Grouped display of a digits-only amount while it is typed. */
  amountText(raw) { const d = String(raw ?? '').replace(/\D/g, ''); return d ? fmt.num(Number(d)) : ''; },
};

/* ============================================================ tax engine
   Brief §2. PPN is computed once per document per tax code, then allocated to
   lines by weight; the largest line absorbs the rounding (§2.4). */
function allocate(total, weights) {
  const W = sum(weights);
  if (!W) return weights.map(() => 0);
  const out = weights.map((w) => Math.floor((total * w) / W));
  out[weights.indexOf(Math.max(...weights))] += total - sum(out);
  return out;
}
/** Exclude: PPN = floor(DPP × 11/12 × 12%). Include: PPN = floor(gross × 11/111), DPP is the remainder. */
function ppnOf(amount, mode) {
  return mode === 'EXC' ? Math.floor((amount * 11) / 100 + 1e-7) : Math.floor((amount * 11) / 111 + 1e-7);
}
/** List price of one line for the document's customer, unit and a given mode. */
function listPrice(d, l, mode = d.mode) {
  const it = itemOf(l.itemId);
  if (!it) return 0;
  const k = mode === 'EXC' ? 0 : 1;
  const c = custById(d.customerId);
  const u = it.uoms.find((x) => x.u === l.uom) || it.uoms[0];
  return it.prices[c ? c.group : 'RTL'][k] * u.f;
}
function calcSo(d) {
  const c = custById(d.customerId);
  const bases = d.lines.map((l) => Math.round((Number(l.qty) || 0) * (Number(l.price) || 0) * (1 - (Number(l.disc) || 0) / 100)));
  const gross0 = sum(d.lines, (l) => (Number(l.qty) || 0) * (Number(l.price) || 0));
  const L = d.lines.map((l, i) => ({ base: bases[i], dpp: bases[i], ppn: 0 }));
  const codes = [...new Set(d.lines.map((l) => itemOf(l.itemId).tax))];
  const groups = codes.map((code) => {
    const idx = d.lines.map((l, i) => i).filter((i) => itemOf(d.lines[i].itemId).tax === code);
    const base = sum(idx, (i) => bases[i]);
    if (!TAX_CODES[code].ppn) return { code, base, dpp: base, ppn: 0, dppNL: 0, ppnable: false };
    const ppn = ppnOf(base, d.mode);
    const al = allocate(ppn, idx.map((i) => bases[i]));
    idx.forEach((i, k) => { L[i].ppn = al[k]; L[i].dpp = d.mode === 'EXC' ? bases[i] : bases[i] - al[k]; });
    const dpp = d.mode === 'EXC' ? base : base - ppn;
    return { code, base, dpp, ppn, dppNL: (dpp * 11) / 12, ppnable: true };
  });
  L.forEach((x) => { x.total = x.dpp + x.ppn; });
  const tx = groups.filter((g) => g.ppnable), nt = groups.filter((g) => !g.ppnable);
  const dpp = sum(tx, (g) => g.dpp), ppn = sum(tx, (g) => g.ppn), taxBase = sum(tx, (g) => g.base), nonTax = sum(nt, (g) => g.base);
  const total = dpp + ppn + nonTax;
  // What the customer is expected to withhold or collect — an estimate from this order's own lines.
  // Only the lines flagged "potong PPh" — the flag is decided on the order and inherited downstream.
  const flagged = (l) => l.wht && whtAllowed(d, c, l);
  const pph22Base = c && c.pph22 ? sum(d.lines, (l, i) => (flagged(l) ? L[i].dpp : 0)) : 0;
  const pph22 = Math.floor((pph22Base * whtRate(d, c)) / 100 + 1e-7);
  const wapuPpn = c && c.wapu ? ppn : 0;
  return { lines: L, groups, gross0, disc: gross0 - sum(bases), taxBase, nonTax, dpp, dppNL: (dpp * 11) / 12, ppn, total,
    pph22Base, pph22, wapuPpn, cash: total - pph22 - wapuPpn };
}

const KINDS = {

/** Document ids are unique across kinds, so one lookup serves every route. */
const getDoc = (id) => db.so.find((s) => s.id === id) || db.prz.find((x) => x.id === id) || db.adv.find((a) => a.id === id) || db.pay.find((p) => p.id === id) || db.sj.find((d) => d.id === id) || db.ret.find((r) => r.id === id) || db.inv.find((x) => x.id === id) || db.fp.find((f) => f.id === id) || db.bp.find((b) => b.id === id);
const getSo = getDoc;
function nextNo(prefix, dateIso) {
  const ym = dateIso.slice(0, 7), key = prefix + ym;
  db.seq[key] = (db.seq[key] || 0) + 1;
  return `${prefix}/${ym.slice(0, 4)}/${ym.slice(5, 7)}/${String(db.seq[key]).padStart(4, '0')}`;
}
function hist(doc, at, label, by, tone = '', ic = 'pen') { doc.history.unshift({ at, label, by, tone, icon: ic }); }

/** Open commitments of a customer: the receivable already on its ledger plus Sales Orders confirmed or awaiting approval. */
function exposure(c, exceptId = null) {
  const open = db.so.filter((s) => s.customerId === c.id && s.id !== exceptId && (s.status === 'Open' || s.status === 'Pending'));
  return { ar: arOf(c.id), so: sum(open, (s) => calcSo(s).total), count: open.length };
}
function creditCheck(d) {
  const c = custById(d.customerId), e = exposure(c, d.id), total = calcSo(d).total;
  const used = e.ar + e.so, after = used + total;
  return { c, e, total, used, after, left: c.limit - after, over: after > c.limit };
}

/* ============================================================ lifecycle */
function newSo(kind, date) {
  return { type: 'so', id: '', kind, no: '', status: 'Draft', date, customerId: '', billTo: '', shipTo: '', poNo: '', poDate: '',
    reqDate: fmt.addDays(date, 3),
    salesId: '', termId: '', whId: '', mode: 'EXC', lines: [], note: '', history: [] };
}
/** Choosing a customer fills everything that depends on it and re-prices the lines from its price list. */
function applyCustomer(d, id) {
  const c = custById(id);
  d.customerId = id;
  d.billTo = c.entities[0].id;
  d.shipTo = d.kind === 'B' ? c.ships[0].id : '';
  d.salesId = c.salesId; d.termId = c.termId; d.mode = c.mode;
  d.whId = d.kind === 'B' ? c.whId : '';
  d.lines.forEach((l) => { l.price = listPrice(d, l); l.wht = whtAllowed(d, c, l); });
}
function saveDoc(d, at, by) {
  d.id = 'so-' + ++db.idn;
  d.no = nextNo(KINDS[d.kind].prefix, d.date);
  hist(d, at, 'Dibuat sebagai Draft', by, '', 'plus');
  db.so.push(d);
  return d;
}
function confirmSo(d, at, by) {
  const k = creditCheck(d);
  if (k.over) { d.status = 'Pending'; hist(d, at, `Diajukan persetujuan — melebihi plafon kredit ${fmt.money(-k.left)}`, by, 'bad', 'lock'); }
  else { d.status = 'Open'; hist(d, at, 'Dikonfirmasi — mode harga dan isi pesanan dikunci', by, 'ok', 'check'); }
  return k;
}
function approveSo(d, at, by) { d.status = 'Open'; hist(d, at, 'Disetujui walaupun melebihi plafon kredit', by, 'ok', 'check'); }
function rejectSo(d, at, by) { d.status = 'Draft'; hist(d, at, 'Ditolak — dikembalikan ke Draft', by, 'bad', 'undo'); }
function cancelSo(d, at, by) { d.status = 'Cancelled'; hist(d, at, 'Dibatalkan', by, 'bad', 'block'); }

/* ============================================================ jenis PPh (withholding types)

const WHT_TYPES = {

const BANKS = [

/* ============================================================ journals
   A journal only ever comes from posting — a document, or the opening balance
   taken over when the system went live. No journal is typed by hand. */
const bal = (lines) => ({ d: sum(lines, (l) => l.debit), c: sum(lines, (l) => l.credit) });
const jl = (acc, debit, credit, memo, partner) => ({ acc, debit: debit || 0, credit: credit || 0, memo: memo || '', partner: partner || '' });

function writeJournal({ date, desc, source = null, lines }, at, by) {
  const j = { id: 'j-' + ++db.idn, no: nextNo('JV', date), date, desc, source, lines, at, by, status: 'Posted' };
  db.journals.push(j);

}
/** Every posted line on an account, oldest first, with the running balance in the account's normal direction. */
function ledger(code, partner = null) {
  const a = accByCode(code), sign = a.nb === 'Debit' ? 1 : -1;
  let run = 0;
  const entries = db.journals.slice().sort((x, y) => (x.date + x.no).localeCompare(y.date + y.no))
    .flatMap((j) => j.lines.filter((l) => l.acc === code && (!partner || l.partner === partner)).map((l) => ({ j, l })))
    .map((e) => { run += sign * (e.l.debit - e.l.credit); return { ...e, balance: run }; });
  return { entries, debit: sum(entries, (e) => e.l.debit), credit: sum(entries, (e) => e.l.credit), closing: run };

const arOf = (customerId) => ledger(ACC.AR, customerId).closing;

/* ============================================================ advance (uang muka penjualan)
   Its own document and its own menu. It takes its customer, faktur identity and
   price mode from a confirmed Sales Order; the user types the amount in that
   mode and the PPN follows. Issuing the bill posts nothing — the advance is not
   a transaction until the money arrives (brief A2), which is also the PPN tax point. */
const getAdv = (id) => db.adv.find((a) => a.id === id);

    taxCode: 'PPN-STD', amount: 0, bankId: 'BCA', desc: '', note: '', history: [] };
}
/** Choosing the Sales Order fills everything the advance takes from it. */
function applySoToAdv(a, soId) {
  const so = getDoc(soId), codes = soCodes(so);
  Object.assign(a, { soId, customerId: so.customerId, billTo: so.billTo, mode: so.mode, amount: 0,
    taxCode: codes.includes('PPN-STD') ? 'PPN-STD' : codes[0],
    desc: `Uang muka atas pesanan ${so.no}${so.poNo ? ` (PO ${so.poNo})` : ''}` });
  a.lines = advLinesFrom(so, a.taxCode);
}
/** The advance's own copy of the order lines of its tax code — the transaction it is drawn from. */
function advLinesFrom(so, code) {
  return so.lines.map((l, li) => ({ li, itemId: l.itemId, uom: l.uom, qty: l.qty, price: l.price, disc: l.disc, wht: l.wht, inc: true }))
    .filter((l) => itemOf(l.itemId).tax === code);
}
/** The transaction behind the advance: its lines with DPP and PPN, and its total DPP. The advance is one global
    amount drawn from that DPP — it is not split over the lines. */
function advBasis(a) {
  const so = getDoc(a.soId);
  if (!so || !a.lines) return null;
  const t = calcSo({ kind: so.kind, customerId: so.customerId, mode: a.mode, lines: a.lines });
  const rows = a.lines.map((l, i) => ({ ...l, dpp: t.lines[i].dpp, ppn: t.lines[i].ppn, total: t.lines[i].total }));
  const v = advCalc(a), dpp = t.dpp + t.nonTax;

}
/** What the advance may still draw: the order's value for the tax code (in the order's price basis) less other live advances on it. */
function advRoom(a) {
  const so = getDoc(a.soId);

  // A perizinan advance draws from the pengajuan's estimate, in its price mode.
  const g = so.type === 'prz' ? { base: przCalc(so).base } : calcSo(so).groups.find((x) => x.code === a.taxCode);
  const value = g ? g.base : 0;
  const used = sum(db.adv.filter((x) => x.soId === a.soId && x.taxCode === a.taxCode && x.id !== a.id && x.status !== 'Cancelled'), (x) => x.amount);
  return { value, used, left: value - used };
}
function advCalc(a) {

  const dpp = T.ppn && a.mode === 'INC' ? amt - ppn : amt;

  let share = 0;

const liveAdvOf = (soId) => db.adv.filter((a) => a.soId === soId && a.status !== 'Cancelled');

function seedAdvances() {
  const U = ME.name;
  const soNo = (no) => db.so.find((s) => s.no === no).id;
  const mk = (date, so, amount, { taxCode, issue = true, due = 7, cancel = false } = {}) => {

    applySoToAdv(a, soNo(so));

/* ============================================================ pembayaran (payments)
   One document for every movement of money, in or out. Its purpose (tujuan)
   decides what it settles and how it posts. The document being settled — an
   advance bill or a sales invoice — only issues the bill; the money is always
   recorded here, by choosing the purpose and then that document.
   Withholding is never a surprise: the settled document already knows how much
   PPh (and, for a WAPU buyer, PPN) the customer will keep. A payment splits the
   gap between what is open and the cash received into those parts by rule, and
   says so; anything the rule does not explain stays open. */
const DIR_TEXT = { IN: 'Uang Masuk', OUT: 'Uang Keluar' };
const PURPOSES = {
  inv: { dir: 'IN', label: 'Faktur Penjualan', short: 'Faktur', desc: 'Pelunasan piutang faktur penjualan' },
  adv: { dir: 'IN', label: 'Uang Muka Penjualan', short: 'Uang Muka', desc: 'Dana dari customer atas tagihan uang muka' },
  ivp: { dir: 'IN', base: 'inv', label: 'Invoice Perizinan', short: 'Inv. Perizinan', desc: 'Pelunasan piutang invoice perizinan' },
  ump: { dir: 'IN', base: 'adv', label: 'Uang Muka Perizinan', short: 'UM Perizinan', desc: 'Dana dari customer atas tagihan uang muka perizinan' },
  'adv-ref': { dir: 'OUT', label: 'Pengembalian Uang Muka', short: 'Refund Uang Muka', desc: 'Sisa uang muka yang tidak terpakai dikembalikan ke customer' },
  'ret-ref': { dir: 'OUT', label: 'Pengembalian Kredit Pelanggan', short: 'Refund Kredit', desc: 'Kredit pelanggan dari nota retur dikembalikan ke customer' },
  'prz-cost': { dir: 'OUT', label: 'Biaya Perizinan', short: 'Biaya Perizinan', desc: 'Biaya pengurusan perizinan sebesar realisasinya, tanpa pajak' },
  'in-other': { dir: 'IN', label: 'Penerimaan Lain-lain', short: 'Penerimaan Lain', desc: 'Dibukukan langsung ke account, mis. jasa giro' },
  'out-other': { dir: 'OUT', label: 'Pengeluaran Lain-lain', short: 'Pengeluaran Lain', desc: 'Dibebankan langsung ke account, mis. biaya administrasi bank' },
};
/* Accounts a direct income or expense line may use. Bank accounts are the other side of the
   payment, and control accounts with a sub-ledger (piutang, uang muka, PPN) only move through their own documents. */
const LINE_ACCOUNTS = ['4-3000', '6-1000', '6-2000', '7-1000'];
const dirOf = (p) => (PURPOSES[p.purpose] ? PURPOSES[p.purpose].dir : '');
/** The perizinan purposes settle the same kinds of bill as the goods ones — an advance or an invoice — so they share its rules. */
const baseP = (p) => (PURPOSES[p.purpose] && PURPOSES[p.purpose].base) || p.purpose;

function newPay(date) {
  return { type: 'pay', id: '', no: '', status: 'Draft', date, purpose: '', bankId: 'BCA', bankRef: '', advId: '', invId: '', retId: '', przId: '', r: null, customerId: '',
    received: 0, charge: 0, pph: 0, whts: [], wapu: 0, lines: [], note: '', history: [], journalId: '' };
}
/** What a payment clears of the bill: cash + bank charge + tax the customer keeps. */
const paySettles = (p) => (Number(p.received) || 0) + (Number(p.charge) || 0) + (Number(p.pph) || 0) + (Number(p.wapu) || 0);
const advPays = (a, { postedOnly = false, exceptId = null } = {}) =>
  db.pay.filter((p) => baseP(p) === 'adv' && p.advId === a.id && p.id !== exceptId && (postedOnly ? p.status === 'Posted' : p.status !== 'Cancelled'));
function advOutstanding(a, exceptId = null) { return advCalc(a).total - sum(advPays(a, { postedOnly: true, exceptId }), paySettles); }
function advPayState(a) {
  if (a.status !== 'Issued') return '';
  const out = advOutstanding(a), total = advCalc(a).total;
  return out <= 0 ? 'Lunas' : out < total ? 'Sebagian' : 'Belum Dibayar';
}
const payTarget = (p) => (baseP(p) === 'adv' || p.purpose === 'adv-ref' ? getDoc(p.advId) : baseP(p) === 'inv' ? getDoc(p.invId) : p.purpose === 'ret-ref' ? getDoc(p.retId) : p.purpose === 'prz-cost' ? getDoc(p.przId) : null);
/** What a bill expects the customer to keep, as a list of withholding components — each type with its own rate.
    A transaction carries one type today; everything downstream works per component, so more types need no change. */
function billWht(t) {
  let code, amount;
  if (t.type === 'adv') { const v = advCalc(t); code = whtCode(getDoc(t.soId)); amount = v.pph23 + v.pph22; }
  // A posted nota retur lowers the tax the customer will keep on the invoice.
  else { const v = invCalc(t); code = whtCode(t); amount = v.wht - sum(retPosted(t), (r) => r.v.wht); }
  return code && amount > 0 ? [{ code, rate: WHT_TYPES[code].rate, amount }] : [];
}
/** The bill's figures and what is still open of each: total, every withholding component and buyer-collected PPN. */
function targetFigures(p) {
  const t = payTarget(p);
  if (!t || (baseP(p) !== 'adv' && baseP(p) !== 'inv')) return null;
  let total, wapu, prev;
  if (t.type === 'adv') {
    const v = advCalc(t);
    total = v.total; wapu = v.wapuPpn; prev = advPays(t, { postedOnly: true, exceptId: p.id });
  } else {
    const v = invCalc(t), rets = retPosted(t);
    total = v.total - sum(rets, (r) => r.v.toAR); wapu = v.wapu - sum(rets, (r) => r.v.wapu);
    prev = invPays(t, { postedOnly: true, exceptId: p.id });
  }
  const comps = billWht(t).map((w) => ({ ...w, left: w.amount - sum(prev, (x) => sum((x.whts || []).filter((y) => y.code === w.code), (y) => y.amount)) }));
  const open = total - sum(prev, paySettles);
  const wht = sum(comps, (w) => w.amount), whtLeft = sum(comps, (w) => w.left), wapuLeft = wapu - sum(prev, (x) => x.wapu);
  return { t, total, comps, wht, wapu, open, whtLeft, wapuLeft, cashLeft: open - whtLeft - wapuLeft };
}
/** Withholding follows the cash — the user enters only what reached the bank. When the cash covers the rest of the bill,

function ruleWht(p) {
  const f = targetFigures(p);
  if (!f) return { whts: [], pph: 0, wapu: 0 };
  const paid = (Number(p.received) || 0) + (Number(p.charge) || 0);
  const k = f.cashLeft <= 0 || paid >= f.cashLeft ? 1 : paid / f.cashLeft;
  const whts = f.comps.map((w) => {
    const amount = k === 1 ? w.left : Math.round(w.left * k);
    return { code: w.code, rate: w.rate, amount, base: Math.round((amount * 100) / w.rate) };
  });
  return { whts, pph: sum(whts, (w) => w.amount), wapu: k === 1 ? f.wapuLeft : Math.round(f.wapuLeft * k) };

/** Picking the bill fills the customer and the cash that would clear it, with the withholding by rule beside it. */
function applyTargetToPay(p, id) {
  const t = getDoc(id);

const applyAdvToPay = applyTargetToPay;
/** The DPP and PPN an advance payment clears. PPN falls due on money received, so each payment carries its share;

function payParts(p) {
  if (p.v) return p.v;
  const a = baseP(p) === 'adv' ? getDoc(p.advId) : null;
  if (!a) return { settles: paySettles(p), ppnPart: 0, dpPart: 0 };
  const v = advCalc(a), settles = paySettles(p);
  const prior = advPays(a, { postedOnly: true, exceptId: p.id });
  const priorPpn = sum(prior, (x) => payParts(x).ppnPart);
  const final = settles >= advOutstanding(a, p.id);
  const ppnPart = !v.ppn ? 0 : final ? v.ppn - priorPpn : Math.round((settles * v.ppn) / v.total);

const srcOrder = (doc) => (doc.type === 'adv' ? getDoc(doc.soId) : doc);
const pphAccount = (doc) => (WHT_TYPES[whtCode(srcOrder(doc))] || WHT_TYPES.PPH22).acc;
/** Each advance sits in its own liability: goods on Uang Muka Penjualan, perizinan on Uang Muka Perizinan. */
const dpAccount = (a) => (a.kind === 'P' ? ACC.DP_PRZ : ACC.DP);
function payJournal(p) {
  const bank = bankById(p.bankId), c = custById(p.customerId), t = payTarget(p);
  if (p.purpose === 'adv-ref') {
    const vatAcc = c.wapu ? ACC.VAT_WAPU : ACC.VAT;
    return { desc: `Pengembalian sisa uang muka ${t.no} — ${c.name}`, lines: [
      jl(dpAccount(t), p.r.dpp, 0, `Sisa uang muka ${t.no} tidak terpakai`, c.id),
      jl(vatAcc, p.r.ppn, 0, 'PPN uang muka dikoreksi — faktur pengganti / pembatalan'),
      jl(bank.acc, 0, p.received, `Transfer pengembalian ke customer${p.bankRef ? ' · ref ' + p.bankRef : ''}`),
      jl(pphAccount(t), 0, p.r.pph, `${whtLabel(srcOrder(t))} atas bagian yang dikembalikan — bukti potong dibetulkan customer`),
      jl(ACC.VAT_WAPU, 0, p.r.wapu, 'PPN dipungut pembeli atas bagian yang dikembalikan'),
    ].filter((l) => l.debit || l.credit) };
  }
  if (p.purpose === 'prz-cost') {
    return { desc: `Pembayaran biaya perizinan ${t.rlzNo} (${t.no}) — ${c.name}`, lines: [
      jl(ACC.COST_PRZ, p.received, 0, `Biaya perizinan realisasi ${t.rlzNo}`),
      jl(bank.acc, 0, p.received, `Pembayaran biaya perizinan${p.bankRef ? ' · ref ' + p.bankRef : ''}`),
    ] };
  }
  if (p.purpose === 'ret-ref') {
    return { desc: `Pengembalian kredit pelanggan ${t.no} — ${c.name}`, lines: [
      jl(ACC_CREDIT, p.received, 0, `Kredit dari ${t.no} dikembalikan`, c.id),
      jl(bank.acc, 0, p.received, `Transfer pengembalian ke customer${p.bankRef ? ' · ref ' + p.bankRef : ''}`),
    ] };
  }
  const common = t ? [
    jl(bank.acc, p.received, 0, `Dana diterima${p.bankRef ? ' · ref ' + p.bankRef : ''}`),
    jl(ACC.BANKFEE, p.charge, 0, 'Biaya transfer dipotong bank pengirim'),
    ...(p.whts || []).map((w) => jl(WHT_TYPES[w.code].acc, w.amount, 0, `${WHT_TYPES[w.code].label} ${fmt.pct(w.rate)} × DPP ${fmt.money(w.base)} dipotong customer — bukti potong draft`)),
    jl(ACC.VAT_WAPU, p.wapu, 0, 'PPN dipungut dan disetor sendiri oleh pembeli'),
  ] : [];
  if (baseP(p) === 'adv') {
    const x = payParts(p), vatAcc = c.wapu ? ACC.VAT_WAPU : ACC.VAT;
    return { desc: `Penerimaan uang muka ${t.no} — ${c.name}`, lines: [...common,
      jl(dpAccount(t), 0, x.dpPart, `Kewajiban atas uang muka ${t.no}`, c.id),
      jl(vatAcc, 0, x.ppnPart, 'PPN uang muka terutang saat dana diterima'),
    ].filter((l) => l.debit || l.credit) };
  }
  if (baseP(p) === 'inv') {

      jl(ACC.AR, 0, paySettles(p), `Pelunasan ${t.no}`, c.id),
    ].filter((l) => l.debit || l.credit) };
  }
  const lines = p.lines.map((l) => (dirOf(p) === 'IN' ? jl(l.acc, 0, l.amount, l.memo) : jl(l.acc, l.amount, 0, l.memo)));
  const total = sum(p.lines, (l) => l.amount);
  const bankLine = dirOf(p) === 'IN' ? jl(bank.acc, total, 0, p.note || 'Dana masuk') : jl(bank.acc, 0, total, p.note || 'Dana keluar');
  return { desc: `${PURPOSES[p.purpose].label}${p.note ? ' — ' + p.note : ''}`, lines: dirOf(p) === 'IN' ? [bankLine, ...lines] : [...lines, bankLine] };
}
function savePay(p, at, by) {

/* ============================================================ tax documents
   Neither document posts: the payment already booked the PPN and the PPh.
   · Faktur Pajak Keluaran — made as a Draft when money for an advance with PPN
     arrives, because receipt of payment before delivery is the tax point. It is
     dated the receipt date and must be uploaded to Coretax by the 15th of the
     next month (PMK 81/2024); upload gives it its number (NSFP).
   · Bukti Potong PPh — made when a customer keeps PPh from a payment. The PPh
     can only be credited in the annual return once the customer's bukti potong
     (BPPU) is in hand, so it waits until it is recorded as received. */
const getFp = (id) => db.fp.find((f) => f.id === id);
const getBp = (id) => db.bp.find((b) => b.id === id);
/** 15th of the month after the tax point. */
function uploadDeadline(iso) {
  const [y, m] = iso.split('-').map(Number);
  return `${m === 12 ? y + 1 : y}-${fmt.pad2(m === 12 ? 1 : m + 1)}-15`;
}
/** The customer deposits and reports the withholding by the 20th of the next month; the BPPU is normally available after that. */
function bpExpected(iso) {
  const [y, m] = iso.split('-').map(Number);
  return `${m === 12 ? y + 1 : y}-${fmt.pad2(m === 12 ? 1 : m + 1)}-20`;
}
const fpLate = (f) => f.status === 'Draft' && !!f.deadline && todayIso() > f.deadline;
const bpLate = (b) => (b.status === 'Awaiting' || b.status === 'Revise') && todayIso() > b.expected;
/** Called when a payment posts: whatever tax documents the receipt gives rise to. */
function taxDocsFromPayment(p, at, by) {
  if (baseP(p) !== 'adv' && baseP(p) !== 'inv') return;
  const t = payTarget(p), so = srcOrder(t), c = custById(p.customerId);
  if (baseP(p) === 'adv' && p.v.ppnPart > 0) {
    const a = t, x = p.v;
    const f = { type: 'fp', id: 'fp-' + ++db.idn, no: nextNo('FPK', p.date), status: 'Draft', kind: 'UM', date: p.date, deadline: uploadDeadline(p.date),
      payId: p.id, srcId: p.id, advId: a.id, customerId: c.id, billTo: a.billTo, kode: c.wapu === 'G' ? '02' : '04',
      desc: `${so.type === 'prz' ? 'Uang muka jasa pengurusan perizinan' : 'Uang muka atas pesanan'} ${so.no}${so.poNo ? ` (PO ${so.poNo})` : ''}`, dpp: x.dpPart, dppNL: (x.dpPart * 11) / 12, ppn: x.ppnPart, nsfp: '', history: [] };
    hist(f, at, `Dibuat otomatis dari ${p.no}`, by, '', 'plus');
    db.fp.push(f); p.fpId = f.id;
  }
  // One bukti potong per withholding type — each is its own slip from the customer.
  p.bpIds = (p.whts || []).filter((w) => w.amount > 0).map((w) => {
    const T = WHT_TYPES[w.code];
    const b = { type: 'bp', id: 'bp-' + ++db.idn, no: nextNo('BP', p.date), status: 'Awaiting', date: p.date, expected: bpExpected(p.date), masa: p.date.slice(0, 7),
      payId: p.id, docId: t.id, customerId: c.id, whtCode: w.code, pphType: T.short, rate: w.rate, base: w.base, amount: w.amount, bpNo: '', bpDate: '', history: [] };
    hist(b, at, `Dibuat otomatis dari ${p.no} — menunggu bukti potong dari customer`, by, '', 'clock');
    db.bp.push(b);
    return b.id;
  });
  p.bpId = p.bpIds[0] || '';
}
/** Coretax gives an approved faktur its 17-digit number: kode transaksi, status, year, then the serial. */
function approveFp(f, at, by) {
  if (f.corr) { approveCorrection(f, at, by); return; }
  db.nsfpSeq = (db.nsfpSeq || 1203) + 1;
  f.nsfp = `${f.kode}0${f.date.slice(2, 4)}${String(db.nsfpSeq).padStart(12, '0')}`;
  f.status = 'Approved'; f.uploadedAt = at;
  hist(f, at, `Diupload ke Coretax dan disetujui — NSFP ${f.nsfp}`, by, 'ok', 'upload');
}
function receiveBp(b, { bpNo, bpDate, amount }, at, by) {
  Object.assign(b, { bpNo, bpDate, bpAmount: amount, status: 'Received' });
  hist(b, at, `Bukti potong diterima — ${bpNo}`, by, 'ok', 'check');
}

/* ============================================================ surat jalan (delivery note)
   Its own document and menu, taken from a confirmed Sales Order Barang. It may
   deliver part of the order; the rest stays open for the next one. It carries
   items and quantities only — no prices — and posting moves the goods out of
   stock at standard cost: Dr HPP Barang · Cr Persediaan Barang Jadi. Delivery is
   also the PPN tax point for goods; the faktur follows with the invoice. */
const ACC_INV = '1-1400', ACC_COGS = '5-1000';
const baseQty = (itemId, uom, qty) => { const it = itemOf(itemId); const u = it.uoms.find((x) => x.u === uom) || it.uoms[0]; return (Number(qty) || 0) * u.f; };
/** What an SO line has already been delivered in: live notes (drafts included) when checking room, posted ones for the order's state. */
function deliveredQty(so, li, { postedOnly = false, exceptId = null } = {}) {
  return sum(db.sj.filter((d) => d.soId === so.id && d.id !== exceptId && (postedOnly ? d.status === 'Posted' : d.status !== 'Cancelled')),
    (d) => sum(d.lines.filter((l) => l.li === li), (l) => l.qty));
}
const lineLeft = (so, li, exceptId = null) => so.lines[li].qty - deliveredQty(so, li, { exceptId });
function soDeliveryState(so) {
  if (so.kind !== 'B' || so.status !== 'Open') return '';
  const done = so.lines.map((l, li) => deliveredQty(so, li, { postedOnly: true }));
  if (done.every((q, li) => q >= so.lines[li].qty)) return 'Terkirim';
  return done.some((q) => q > 0) ? 'Sebagian' : 'Belum Dikirim';
}
/** Stock ready to sell in a warehouse, in the base unit: the opening count less every posted delivery from it. */
function stockOf(itemId, whId, exceptId = null) {
  const out = sum(db.sj.filter((d) => d.status === 'Posted' && d.whId === whId && d.id !== exceptId),
    (d) => sum(d.lines.filter((l) => l.itemId === itemId), (l) => baseQty(l.itemId, l.uom, l.qty)));
  return itemOf(itemId).stock[whId] - out;
}
const liveSjOf = (soId) => db.sj.filter((d) => d.soId === soId && d.status !== 'Cancelled');

function newSj(date) {
  return { type: 'sj', id: '', no: '', status: 'Draft', date, soId: '', customerId: '', shipTo: '', whId: '', vehicle: '', driver: '', lines: [], note: '', history: [], journalId: '' };
}
/** Picking the order brings its address, warehouse and every line still to deliver, at the full remaining quantity. */
function applySoToSj(d, soId) {
  const so = getDoc(soId);
  Object.assign(d, { soId, customerId: so.customerId, shipTo: so.shipTo, whId: so.whId });
  d.lines = so.lines.map((l, li) => ({ li, itemId: l.itemId, uom: l.uom, qty: lineLeft(so, li, d.id) })).filter((l) => l.qty > 0);
}
function sjCost(d) {
  const lines = d.lines.map((l) => ({ ...l, base: baseQty(l.itemId, l.uom, l.qty), cost: baseQty(l.itemId, l.uom, l.qty) * itemOf(l.itemId).cost }));
  return { lines, cost: sum(lines, (l) => l.cost), qty: sum(lines, (l) => l.base) };
}
function sjJournal(d) {
  const so = getDoc(d.soId), c = custById(d.customerId), v = sjCost(d).lines.filter((l) => l.cost);
  return { desc: `Pengiriman ${so.no} — ${c.name}`, lines: [
    ...v.map((l) => jl(ACC_COGS, l.cost, 0, `HPP ${l.itemId} · ${fmt.num(l.base)} pcs × ${fmt.num(itemOf(l.itemId).cost)}`)),
    ...v.map((l) => jl(ACC_INV, 0, l.cost, `Keluar ${whById(d.whId).code} · ${l.itemId} ${fmt.num(l.base)} pcs`)),
  ] };
}
/** Stock the note would overdraw, if any. */
function sjShortage(d) {
  const need = {};
  d.lines.forEach((l) => { need[l.itemId] = (need[l.itemId] || 0) + baseQty(l.itemId, l.uom, l.qty); });
  return Object.entries(need).filter(([id, q]) => q > stockOf(id, d.whId, d.id)).map(([id, q]) => ({ id, need: q, have: stockOf(id, d.whId, d.id) }));
}
function saveSj(d, at, by) {
  d.id = 'sj-' + ++db.idn;
  d.no = nextNo('SJ', d.date);
  hist(d, at, 'Dibuat sebagai Draft', by, '', 'plus');
  db.sj.push(d);
  return d;
}
function postSj(d, at, by) {
  const j = sjJournal(d);
  const rec = writeJournal({ date: d.date, desc: j.desc, source: { type: 'sj', id: d.id }, lines: j.lines }, at, by);
  d.journalId = rec.id; d.status = 'Posted';
  hist(d, at, 'Diposting — barang keluar dari gudang', by, 'ok', 'truck');
  return rec;
}
function cancelSj(d, at, by) { d.status = 'Cancelled'; hist(d, at, 'Dibatalkan', by, 'bad', 'block'); }

/* ============================================================ withholding, decided per line
   Whether a customer withholds PPh on a line is decided when the order is
   entered, not discovered at payment: goods sold to a PPh 22 collector
   (government treasurer) and services subject to PPh 23 sold to a withholder.
   The rate comes from the customer. Every later document inherits the flag, so
   the PPh a payment will be short by is known before the money arrives. */
/* Perizinan is a service: every buyer is assumed to withhold PPh 23 at 2% of DPP. */
/** The withholding type a transaction falls under. The type decides the rate — no rate is written anywhere else. */
const whtCode = (d, c = d && custById(d.customerId)) => (!d ? '' : d.kind === 'P' ? 'PPH23' : c && c.pph22 ? 'PPH22' : '');
const whtRate = (d, c) => { const k = c ? whtCode(d, c) : ''; return k ? WHT_TYPES[k].rate : 0; };
const whtAllowed = (d, c) => whtRate(d, c) > 0;
const whtLabel = (d) => (WHT_TYPES[whtCode(d)] || WHT_TYPES.PPH22).label;

/* ============================================================ faktur penjualan (sales invoice)
   Its own menu, made from one posted Surat Jalan; quantities come from the note
   and prices, discounts, price mode and the withholding flag from the order.
   Mainstream practice: before posting, the invoice takes the customer's paid
   advances as deductions. Posting then recognises the full revenue but only the
   PPN not already due on those advances, so no PPN is counted twice:
     Dr Piutang Usaha (net) · Dr Uang Muka Penjualan (advance DPP)
     Cr Penjualan Barang (full DPP) · Cr PPN Keluaran (net PPN)
   and makes the faktur pajak — a faktur pelunasan referring to the faktur uang
   muka, or a normal faktur when nothing was deducted. */
const invOfSj = (sjId) => db.inv.find((x) => x.sjId === sjId && x.status !== 'Cancelled');
function newInv(date, kind = 'B') {
  return { type: 'inv', id: '', no: '', status: 'Draft', kind, date, sjId: '', soId: '', customerId: '', billTo: '', mode: 'EXC', termId: '', lines: [], deds: [], note: '', history: [], journalId: '', fpId: '' };
}
/** The advance's paid part — only money received can be deducted, because only it has had its PPN acknowledged. */
function advPaidParts(a) {
  const ps = db.pay.filter((p) => baseP(p) === 'adv' && p.advId === a.id && p.status === 'Posted');
  return { dpp: sum(ps, (p) => p.v.dpPart), ppn: sum(ps, (p) => p.v.ppnPart) };
}
const invLive = (exceptId) => db.inv.filter((x) => x.status !== 'Cancelled' && x.id !== exceptId);
/** DPP and PPN of an advance already taken by invoices (drafts included, so two invoices cannot take the same money). */
function advAppliedParts(a, exceptId = null) {
  const deds = invLive(exceptId).flatMap((x) => x.deds.filter((y) => y.advId === a.id).map((y) => ({ y, x })));
  return { dpp: sum(deds, (e) => e.y.dpp), ppn: sum(deds, (e) => (e.x.v ? e.x.v.deds.find((z) => z.advId === a.id).ppn : 0)) };
}
const advAvailable = (a, exceptId = null) => advPaidParts(a).dpp - advAppliedParts(a, exceptId).dpp - sum(advRefunds(a, { postedOnly: false }), (p) => p.r.dpp);
function advApplyState(a) {
  if (a.status !== 'Issued') return '';
  const u = advUnused(a);
  if (advRefunds(a).length && u.dpp <= 0) return 'Dikembalikan';
  if (u.dpp > 0 && ['Done', 'Cancelled'].includes(getDoc(a.soId).status)) return 'Perlu Dikembalikan';
  const paid = advPaidParts(a).dpp, used = advAppliedParts(a).dpp, full = advCalc(a).dpp;
  if (!used) return 'Belum Dipakai';
  return used >= full ? 'Habis' : 'Sebagian';
}
/** Advances of this customer an invoice may deduct: paid money not yet taken, same order first. */
function dedCandidates(inv) {
  return db.adv.filter((a) => a.soId === inv.soId && a.status === 'Issued' && a.taxCode === 'PPN-STD' && (advAvailable(a, inv.id) > 0 || inv.deds.some((y) => y.advId === a.id)))
    .sort((x, y) => (y.soId === inv.soId) - (x.soId === inv.soId) || x.date.localeCompare(y.date));
}
/** Choosing the note brings its lines at the order's prices, and deducts the same order's paid advances as far as they reach. */
function applySjToInv(inv, sjId) {
  const sj = getDoc(sjId), so = getDoc(sj.soId);
  Object.assign(inv, { sjId, soId: so.id, customerId: so.customerId, billTo: so.billTo, mode: so.mode, termId: so.termId });
  inv.lines = sj.lines.map((l) => { const s = so.lines[l.li]; return { li: l.li, itemId: l.itemId, uom: l.uom, qty: l.qty, price: s.price, disc: s.disc, wht: s.wht }; });
  inv.deds = [];
  let room = calcSo(inv).dpp;
  for (const a of dedCandidates(inv).filter((x) => x.soId === so.id)) {
    const take = Math.min(advAvailable(a, inv.id), room);
    if (take > 0) { inv.deds.push({ advId: a.id, dpp: take }); room -= take; }
  }
}
/** PPN that goes with a deduction: the advance's own ratio, and whatever is left on the deduction that empties it. */
function dedPpn(inv, y) {
  const a = getDoc(y.advId), v = advCalc(a), paid = advPaidParts(a), used = advAppliedParts(a, inv.id);
  if (!v.dpp) return 0;
  const empties = used.dpp + y.dpp >= v.dpp && paid.dpp >= v.dpp;
  return empties ? paid.ppn - used.ppn : Math.round((y.dpp * v.ppn) / v.dpp);
}
function invCalc(inv) {
  if (inv.v) return inv.v;
  const c = custById(inv.customerId), g = inv.kind === 'P' ? przGross(inv) : calcSo(inv);
  const deds = inv.deds.map((y) => ({ ...y, ppn: dedPpn(inv, y) }));
  const aDpp = sum(deds, (y) => y.dpp), aPpn = sum(deds, (y) => y.ppn);
  const dpp = g.dpp - aDpp, ppn = g.ppn - aPpn, total = dpp + ppn;
  // Withholding on what is left to pay: the flagged lines' DPP, less the advance's share of it (its PPh was withheld when the advance was paid).
  const whtDpp = inv.kind === 'P' ? g.dpp : sum(inv.lines, (l, i) => (l.wht ? g.lines[i].dpp : 0));
  const share = g.dpp ? whtDpp / g.dpp : 0;
  const whtBase = Math.round(whtDpp - aDpp * share);
  const rate = whtRate(inv, c), wht = Math.floor((whtBase * rate) / 100 + 1e-7);
  const wapu = c && c.wapu ? ppn : 0;
  return { g, deds, aDpp, aPpn, dpp, dppNL: (dpp * 11) / 12, ppn, total, whtBase, rate, wht, wapu, cash: total - wht - wapu };
}
const invDue = (inv) => fmt.addDays(inv.date, termById(inv.termId).days);
function invJournal(inv) {
  const c = custById(inv.customerId), v = invCalc(inv), vat = c.wapu ? ACC.VAT_WAPU : ACC.VAT, P = inv.kind === 'P';
  return { desc: P ? `Invoice perizinan ${getDoc(inv.soId).rlzNo} — ${c.name}` : `Faktur penjualan ${getDoc(inv.sjId).no} — ${c.name}`, lines: [
    jl(ACC.AR, v.total, 0, 'Tagihan setelah dikurangi uang muka', c.id),
    ...v.deds.map((y) => jl(dpAccount(getDoc(y.advId)), y.dpp, 0, `Uang muka ${getDoc(y.advId).no} dipakai`, c.id)),

function saveInv(inv, at, by) {

/* Receivable still open on an invoice: its total less every posted payment's settlement. */

function soWhtShare(so, code) {

/* ============================================================ order completion
   A goods order ends as Selesai: by itself once everything ordered is delivered
   and every delivery invoiced, or by Tutup Pesanan when the rest will not ship.
   A closed order takes no new delivery or advance; what was delivered can still
   be invoiced, and a paid advance left unused is refunded from Pembayaran. */
function soComplete(so) {
  if (so.kind !== 'B') return false;
  const delivered = so.lines.every((l, li) => deliveredQty(so, li, { postedOnly: true }) >= l.qty);
  const sjs = db.sj.filter((d) => d.soId === so.id && d.status === 'Posted');
  return delivered && sjs.every((d) => { const x = invOfSj(d.id); return x && x.status === 'Posted'; });
}
function refreshSo(so, at, by) {

}
const soLeft = (so) => so.lines.map((l, li) => ({ itemId: l.itemId, uom: l.uom, qty: l.qty - deliveredQty(so, li, { postedOnly: true }) })).filter((x) => x.qty > 0);

  so.closed = { at, by, reason, left };
  hist(so, at, `Pesanan ditutup — sisa tidak dikirim: ${left.map((x) => `${fmt.qty(x.qty, x.uom)} ${x.itemId}`).join(', ')}`, by, 'bad', 'lock');
}

/* ============================================================ unused advance → refund
   Money received as an advance belongs to its own order. When the order ends
   with part of it unused, the unused part is refunded — a purpose of
   Pembayaran (Uang Keluar · Pengembalian Uang Muka), never moved to another order. */
const advRefunds = (a, { postedOnly = true, exceptId = null } = {}) =>
  db.pay.filter((p) => p.purpose === 'adv-ref' && p.advId === a.id && p.id !== exceptId && (postedOnly ? p.status === 'Posted' : p.status !== 'Cancelled'));
function advAppliedPosted(a) {
  const ds = db.inv.filter((x) => x.status === 'Posted').flatMap((x) => x.v.deds.filter((y) => y.advId === a.id));
  return { dpp: sum(ds, (y) => y.dpp), ppn: sum(ds, (y) => y.ppn) };
}
/** The paid part nobody used: its DPP and PPN, and — in proportion — the PPh and buyer-collected PPN the customer kept on it. */
function advUnused(a, exceptId = null) {
  const pays = db.pay.filter((p) => baseP(p) === 'adv' && p.advId === a.id && p.status === 'Posted');
  const paid = { dpp: sum(pays, (p) => p.v.dpPart), ppn: sum(pays, (p) => p.v.ppnPart), pph: sum(pays, (p) => p.pph), wapu: sum(pays, (p) => p.wapu) };
  const used = advAppliedPosted(a), refs = advRefunds(a, { exceptId });
  const done = { dpp: used.dpp + sum(refs, (p) => p.r.dpp), ppn: used.ppn + sum(refs, (p) => p.r.ppn) };
  const dpp = paid.dpp - done.dpp, ppn = paid.ppn - done.ppn;
  // Cumulative rounding: the refund that empties the advance takes whatever PPh / PPN-WAPU is left.
  const cum = (total, x, of) => (of ? Math.round((total * x) / of) : 0);
  const pph = cum(paid.pph, done.dpp + dpp, paid.dpp) - cum(paid.pph, done.dpp, paid.dpp);
  const wapu = cum(paid.wapu, done.ppn + ppn, paid.ppn) - cum(paid.wapu, done.ppn, paid.ppn);
  return { dpp, ppn, pph, wapu, cash: dpp + ppn - pph - wapu };
}
const advRefundable = (a) => a.status === 'Issued' && ['Done', 'Cancelled'].includes(getDoc(a.soId).status) && advUnused(a).dpp > 0;
function applyRefundToPay(p, advId) {
  const a = getDoc(advId), u = advUnused(a, p.id);
  Object.assign(p, { advId, customerId: a.customerId, r: { dpp: u.dpp, ppn: u.ppn, pph: u.pph, wapu: u.wapu }, received: u.cash, charge: 0, pph: 0, wapu: 0 });
}

/* ============================================================ faktur pengganti / pembatalan
   A faktur that overstates the transaction is replaced, not cancelled: the
   replacement keeps the original date (so it corrects the original tax period)
   and, once approved in Coretax, the original counts as Diganti. A faktur whose
   transaction disappears entirely is cancelled (pembatalan). A faktur still in
   Draft is simply corrected before it is uploaded. */
const fpEffective = (f) => !f.pendingBy && !['Replaced', 'Voided'].includes(f.status) && f.corr !== 'batal';
function fpCorrection(f, { dpp, ppn, corr, billTo, desc, reason, src }, at, by) {
  const x = { ...f, id: 'fp-' + ++db.idn, no: nextNo('FPK', at.slice(0, 10)), status: 'Draft', corr, replaces: f.id, reason, srcId: src || f.srcId,
    dpp, ppn, dppNL: (dpp * 11) / 12, billTo: billTo || f.billTo, desc: desc || f.desc, nsfp: '', uploadedAt: '', pendingBy: '', history: [] };
  delete x.deadline;
  hist(x, at, `Dibuat — ${corr === 'batal' ? 'pembatalan' : 'pengganti'} ${f.no}: ${reason}`, by, '', 'plus');
  f.pendingBy = x.id;
  hist(f, at, `${corr === 'batal' ? 'Pembatalan' : 'Faktur pengganti'} ${x.no} dibuat — menunggu upload`, by, '', 'undo');
  db.fp.push(x);
  return x;
}
/** The refund takes its DPP and PPN back from the advance's faktur uang muka, latest first. */
function taxOnAdvRefund(p, at, by) {
  const a = getDoc(p.advId);
  let takeD = p.r.dpp, takeP = p.r.ppn;
  const made = [];
  const fks = db.fp.filter((f) => f.kind === 'UM' && f.advId === a.id && fpEffective(f)).sort((x, y) => (y.date + y.no).localeCompare(x.date + x.no));
  for (const f of fks) {
    if (takeD <= 0) break;
    const d1 = Math.min(takeD, f.dpp);
    const p1 = d1 === takeD ? Math.min(takeP, f.ppn) : Math.min(f.ppn, Math.round((f.ppn * d1) / f.dpp));
    if (f.status === 'Draft') {
      f.dpp -= d1; f.ppn -= p1; f.dppNL = (f.dpp * 11) / 12;
      if (f.dpp <= 0) { f.status = 'Voided'; hist(f, at, `Dibatalkan sebelum diupload — uang muka dikembalikan (${p.no})`, by, 'bad', 'block'); }
      else hist(f, at, `Nilai dikurangi sebelum diupload — pengembalian uang muka ${p.no}`, by, '', 'pen');
      made.push(f.id);
    } else {
      const corr = d1 >= f.dpp ? 'batal' : 'pengganti';
      made.push(fpCorrection(f, { dpp: f.dpp - d1, ppn: f.ppn - p1, corr, reason: `uang muka ${fmt.money(d1)} dikembalikan (${p.no})`, src: p.id }, at, by).id);
    }
    takeD -= d1; takeP -= p1;
  }
  p.fpIds = made;
}
/** Coretax approval of a correction: a replacement gets a number with status digit 1 and makes the original Diganti; a pembatalan voids it. */
function approveCorrection(x, at, by) {
  const f = getDoc(x.replaces);
  if (x.corr === 'batal') {
    x.status = 'Approved'; x.uploadedAt = at;
    f.status = 'Voided'; f.pendingBy = '';
    hist(x, at, 'Pembatalan disetujui di Coretax', by, 'ok', 'upload');
    hist(f, at, `Dibatalkan di Coretax (${x.no})`, by, 'bad', 'block');
  } else {
    db.nsfpSeq = (db.nsfpSeq || 1203) + 1;
    x.nsfp = `${x.kode}1${x.date.slice(2, 4)}${String(db.nsfpSeq).padStart(12, '0')}`;
    x.status = 'Approved'; x.uploadedAt = at;
    f.status = 'Replaced'; f.pendingBy = '';
    hist(x, at, `Diupload ke Coretax dan disetujui — NSFP ${x.nsfp} (pengganti)`, by, 'ok', 'upload');
    hist(f, at, `Diganti oleh ${x.no}`, by, '', 'undo');

}
/** A bukti potong the customer must now correct: the PPh it should show drops, and the old slip no longer counts. */
function reviseBp(docId, cut, reason, at, by) {
  let left = cut;
  const bps = db.bp.filter((b) => b.docId === docId && b.amount > 0).sort((x, y) => (y.date + y.no).localeCompare(x.date + x.no));
  for (const b of bps) {
    const c = Math.min(left, b.amount);
    if (!c) continue;
    if (b.origAmount == null) b.origAmount = b.amount;
    const was = b.amount;
    b.amount -= c; b.base = Math.round((b.amount * 100) / b.rate);
    b.status = 'Revise'; b.bpNo = ''; b.bpDate = '';
    hist(b, at, `Perlu pembetulan — ${reason}: PPh ${fmt.money(was)} → ${fmt.money(b.amount)}`, by, 'bad', 'undo');
    left -= c;
    if (left <= 0) break;
  }

/* ============================================================ nota retur
   Goods already invoiced that come back. Financial and tax side only — the
   warehouse is not handled; standard cost simply goes back from HPP to stock.
   PPN is reduced in the retur's own period; a PKP buyer makes the nota retur in
   Coretax, so it waits for the buyer's number. The retur first reduces what is
   still open on the invoice; the paid part becomes kredit pelanggan (no PPN),
   refunded from Pembayaran. Tax the customer kept on the returned value comes
   back off their bukti potong. */
const ACC_RET = '4-1100', ACC_CREDIT = '2-1300';
function newRet(date) {
  return { type: 'ret', id: '', no: '', status: 'Draft', date, invId: '', soId: '', customerId: '', reason: '', lines: [], note: '', history: [], journalId: '', fpId: '' };
}
const retLive = (inv, exceptId = null) => db.ret.filter((r) => r.invId === inv.id && r.status !== 'Cancelled' && r.id !== exceptId);
const retPosted = (inv, exceptId = null) => db.ret.filter((r) => r.invId === inv.id && r.status === 'Posted' && r.id !== exceptId);
const returnedQty = (inv, i, exceptId = null) => sum(retLive(inv, exceptId), (r) => sum(r.lines.filter((l) => l.i === i), (l) => l.qty));
function applyInvToRet(r, invId) {
  const inv = getDoc(invId);
  Object.assign(r, { invId, soId: inv.soId, customerId: inv.customerId });
  r.lines = inv.lines.map((l, i) => ({ i, itemId: l.itemId, uom: l.uom, price: l.price, disc: l.disc, wht: l.wht, qty: 0 }))
    .filter((l) => inv.lines[l.i].qty - returnedQty(inv, l.i, r.id) > 0);
}
function retCalc(r) {
  if (r.v) return r.v;
  const inv = getDoc(r.invId), c = custById(r.customerId);
  if (!inv) return { dpp: 0, ppn: 0, total: 0, cost: 0, toAR: 0, pphX: 0, wapuX: 0, credit: 0, wht: 0, wapu: 0 };
  const lines = r.lines.filter((l) => l.qty > 0);
  const t = calcSo({ kind: 'B', customerId: r.customerId, mode: inv.mode, lines });
  const cost = sum(lines, (l) => baseQty(l.itemId, l.uom, l.qty) * itemOf(l.itemId).cost);
  const rate = whtRate(inv, c);
  const wht = Math.floor((sum(lines, (l, k) => (l.wht ? t.lines[k].dpp : 0)) * rate) / 100 + 1e-7);
  const wapu = c.wapu ? t.ppn : 0;
  // Split against the invoice as it stands without this retur.
  const iv = invCalc(inv), prev = retPosted(inv, r.id);
  const settled = invPays(inv, { postedOnly: true });
  const open = invOutstanding(inv, null, r.id);
  const toAR = Math.min(t.total, Math.max(0, open));
  const excess = t.total - toAR;
  const pphPaid = sum(settled, (p) => p.pph), wapuPaid = sum(settled, (p) => p.wapu);
  const whtAfter = iv.wht - sum(prev, (x) => x.v.wht) - wht, wapuAfter = iv.wapu - sum(prev, (x) => x.v.wapu) - wapu;
  const pphX = Math.min(excess, Math.max(0, pphPaid - whtAfter - sum(prev, (x) => x.v.pphX)));
  const wapuX = Math.min(excess - pphX, Math.max(0, wapuPaid - wapuAfter - sum(prev, (x) => x.v.wapuX)));
  return { dpp: t.dpp, ppn: t.ppn, total: t.total, cost, wht, wapu, toAR, pphX, wapuX, credit: excess - pphX - wapuX, lines: t.lines };
}
function retJournal(r) {
  const c = custById(r.customerId), inv = getDoc(r.invId), v = retCalc(r), vat = c.wapu ? ACC.VAT_WAPU : ACC.VAT;
  return { desc: `Nota retur ${inv.no} — ${c.name}`, lines: [
    jl(ACC_RET, v.dpp, 0, `Retur penjualan: ${r.reason}`),
    jl(vat, v.ppn, 0, 'PPN Keluaran berkurang di masa retur'),
    jl(ACC.AR, 0, v.toAR, `Mengurangi sisa piutang ${inv.no}`, c.id),
    jl(pphAccount(inv), 0, v.pphX, `${whtLabel(inv)} atas nilai retur — bukti potong dibetulkan customer`),
    jl(ACC.VAT_WAPU, 0, v.wapuX, 'PPN dipungut pembeli atas nilai retur'),
    jl(ACC_CREDIT, 0, v.credit, `Faktur sudah dibayar — kredit pelanggan tanpa PPN`, c.id),
    jl(ACC_INV, v.cost, 0, 'Barang retur kembali ke persediaan (harga pokok standar)'),
    jl(ACC_COGS, 0, v.cost, 'Pembalikan HPP barang retur'),

}
function saveRet(r, at, by) {
  r.id = 'ret-' + ++db.idn;

  return r;
}
function postRet(r, at, by) {
  r.v = retCalc(r);

  r.journalId = rec.id; r.status = 'Posted';
  hist(r, at, 'Diposting', by, 'ok', 'check');
  const inv = getDoc(r.invId), c = custById(r.customerId), v = r.v;
  const refs = inv.fpId ? [inv.fpId] : db.fp.filter((f) => f.kind === 'UM' && inv.v.deds.some((y) => y.advId === f.advId) && fpEffective(f)).map((f) => f.id);
  const f = { type: 'fp', id: 'fp-' + ++db.idn, no: nextNo('FPK', r.date), status: c.pkp ? 'Waiting' : 'Draft', kind: 'RT', date: r.date, retId: r.id, invId: inv.id, srcId: r.id,
    customerId: c.id, billTo: inv.billTo, kode: inv.v && c.wapu === 'G' ? '02' : '04', refs, desc: `Retur atas ${inv.no}: ${r.reason}`,
    items: r.lines.filter((l) => l.qty > 0).map((l, k) => ({ itemId: l.itemId, uom: l.uom, qty: l.qty, price: l.price, disc: l.disc, dpp: -v.lines[k].dpp, ppn: -v.lines[k].ppn })),
    dpp: -v.dpp, dppNL: (-v.dpp * 11) / 12, ppn: -v.ppn, nsfp: '', history: [] };
  hist(f, at, c.pkp ? `Dibuat otomatis dari ${r.no} — menunggu nota retur dari pembeli di Coretax` : `Dibuat otomatis dari ${r.no} — pembeli bukan PKP, dicatat penjual`, by, '', 'plus');
  db.fp.push(f); r.fpId = f.id;

}

/** The buyer's nota retur arrives from Coretax: record its number. */
function confirmRt(f, at, by) {
  db.rtSeq = (db.rtSeq || 40) + 1;
  f.nsfp = `RET-${f.date.slice(0, 4)}-${String(db.rtSeq).padStart(6, '0')}`;

/* Kredit pelanggan from a retur, and what is left of it after refunds. */
const retRefunds = (r, { postedOnly = true, exceptId = null } = {}) =>
  db.pay.filter((p) => p.purpose === 'ret-ref' && p.retId === r.id && p.id !== exceptId && (postedOnly ? p.status === 'Posted' : p.status !== 'Cancelled'));
const retCreditLeft = (r, exceptId = null) => (r.status === 'Posted' ? r.v.credit - sum(retRefunds(r, { exceptId }), (p) => p.received) : 0);

/* ============================================================ seed — the goods cases of v2 */

/* ============================================================ perizinan
   Product registration for a makloon customer — its own route, not a Sales
   Order. Sales & Marketing submits a Pengajuan Perizinan listing each permit at
   its estimated price; once approved it is the basis for the customer's advance
   (Uang Muka Perizinan), usually billed in full. When the permits are done the
   same document records what each one really cost — prices move, and permits
   not in the estimate are added at an estimate of 0 — and gets its realisation
   number. The realisation is the basis for paying the permit costs (a plain
   expense, no tax) and for the Invoice Perizinan, which deducts the paid
   advance. Neither the pengajuan nor its realisation posts a journal.
   Internal documents list every permit; the advance and the invoice the
   customer receives carry one summed line. */
function newPrz(date) {
  return { type: 'prz', kind: 'P', id: '', no: '', status: 'Draft', date, customerId: '', billTo: '', poNo: '', poDate: '', salesId: '', termId: '', mode: 'EXC',
    product: '', lines: [], note: '', rlzNo: '', rlzDate: '', rlzNote: '', history: [] };
}
function applyCustomerPrz(d, id) {
  const c = custById(id);
  Object.assign(d, { customerId: id, billTo: c.entities[0].id, salesId: c.salesId, termId: c.termId, mode: c.mode });
}
/** Estimate or realisation of a pengajuan: prices are typed in its price mode, PPN once over the total. */
function przCalc(d, which = 'est') {
  const base = sum(d.lines, (l) => (which === 'real' ? Number(l.real) || 0 : Number(l.est) || 0));
  const ppn = ppnOf(base, d.mode), dpp = d.mode === 'EXC' ? base : base - ppn;
  const pph23 = Math.floor(dpp * 0.02 + 1e-7);
  return { base, dpp, dppNL: (dpp * 11) / 12, ppn, total: dpp + ppn, pph23, cash: dpp + ppn - pph23 };
}
function savePrz(d, at, by) {
  d.id = 'prz-' + ++db.idn;
  d.no = nextNo('PRZ', d.date);
  hist(d, at, 'Dibuat sebagai Draft', by, '', 'plus');
  db.prz.push(d);
  return d;
}
function approvePrz(d, at, by) { d.status = 'Unrealized'; hist(d, at, 'Disetujui — harga estimasi dikunci, menunggu realisasi', by, 'ok', 'check'); }
function cancelPrz(d, at, by) { d.status = 'Cancelled'; hist(d, at, 'Dibatalkan', by, 'bad', 'block'); }
/** Opening the realisation: every permit starts at its estimate until the user enters what it really cost. */
function startRealization(d, date) {
  if (!d.rlzDate) d.rlzDate = date;
  d.lines.forEach((l) => { if (l.real == null) l.real = l.est; });
}
function realizePrz(d, at, by) {
  d.status = 'Realized';
  d.rlzNo = nextNo('RLZ', d.rlzDate);
  hist(d, at, `Direalisasi — ${d.rlzNo}: DPP ${fmt.money(przCalc(d).dpp)} → ${fmt.money(przCalc(d, 'real').dpp)}`, by, 'ok', 'check');
}
function finishPrz(d, at, by) { if (d && d.status === 'Realized') { d.status = 'Done'; hist(d, at, 'Selesai — realisasi sudah ditagih', by, 'ok', 'check'); } }
const przAdvs = (d) => db.adv.filter((a) => a.soId === d.id && a.status !== 'Cancelled');
const przInv = (d) => db.inv.find((x) => x.soId === d.id && x.status !== 'Cancelled');
const przCostPays = (d, { postedOnly = false, exceptId = null } = {}) =>
  db.pay.filter((p) => p.purpose === 'prz-cost' && p.przId === d.id && p.id !== exceptId && (postedOnly ? p.status === 'Posted' : p.status !== 'Cancelled'));
/** Realised cost still to pay: the realised DPP less every live payment (drafts included, so two cannot pay the same). */
const przCostLeft = (d, exceptId = null) => (['Realized', 'Done'].includes(d.status) ? przCalc(d, 'real').dpp - sum(przCostPays(d, { exceptId }), (p) => p.received) : 0);
/** The realisation stays open to correction until it is invoiced or a payment of its cost exists. */
const przRealEditable = (d) => d.status === 'Unrealized' || (d.status === 'Realized' && !przInv(d) && !przCostPays(d).length);
/** The invoice's gross: the realisation as one amount — no lines are carried to the customer's document. */
function przGross(inv) {
  const d = getDoc(inv.soId);
  if (!d) return { dpp: 0, ppn: 0, total: 0, lines: [] };
  const x = przCalc(d, 'real');
  return { dpp: x.dpp, ppn: x.ppn, total: x.total, lines: [] };
}
/** Choosing the pengajuan fills the advance; its amount starts at what is left of the estimate — customers usually pay in full. */
function applyPrzToAdv(a, id) {
  const d = getDoc(id);
  Object.assign(a, { kind: 'P', soId: id, customerId: d.customerId, billTo: d.billTo, mode: d.mode, taxCode: 'PPN-STD', lines: null,
    desc: `Uang muka jasa pengurusan perizinan ${d.no}${d.poNo ? ` (PO ${d.poNo})` : ''}` });
  a.amount = Math.max(0, advRoom(a).left);
}
/** Choosing the realisation brings its total as one line and deducts the pengajuan's paid advances as far as they reach. */
function applyPrzToInv(inv, id) {
  const d = getDoc(id);
  Object.assign(inv, { kind: 'P', soId: id, sjId: '', customerId: d.customerId, billTo: d.billTo, mode: d.mode, termId: d.termId, lines: [], deds: [] });
  let room = przCalc(d, 'real').dpp;
  for (const a of dedCandidates(inv)) {
    const take = Math.min(advAvailable(a, inv.id), room);
    if (take > 0) { inv.deds.push({ advId: a.id, dpp: take }); room -= take; }
  }
}
function applyPrzCost(p, id) {
  const d = getDoc(id);
  Object.assign(p, { przId: id, customerId: d.customerId, received: Math.max(0, przCostLeft(d, p.id)) });
}

   Routes are strings so a link is one attribute: list:sob · doc:so:id ·
   edit:adv:id · new:sob · new:adv · copy:so:id · rec:customer:id · rec:journal:id */
function parseRoute(s) {
  const p = s.split(':');
  switch (p[0]) {
    case 'list': return { page: 'list', key: p[1] };
    case 'doc': return { page: 'doc', id: p[2] };
    case 'edit': return { page: 'edit', id: p[2] };
    case 'copy': return { page: 'copy', id: p[2] };
    case 'new': return { page: 'new', key: p[1] };
    case 'rec': return { page: 'rec', key: p[1], id: p[2] };
  }
  return { page: 'list', key: 'sob' };
}
function leafOfRoute(r) {
  if (r.page === 'list' || r.page === 'new' || r.page === 'rec') return r.key;
  const d = ui.form ? ui.form.doc : getDoc(r.id);
  return !d ? 'sob' : leafOf(d);
}

  ui.route = r;
  ui.form = null;
  if (r.page === 'new') ui.form = { mode: 'new', doc: (NEW_DOC[r.key] || NEW_DOC.sob)(todayIso()), dirty: false, errors: {} };
  if (r.page === 'edit') {
    const doc = structuredClone(getDoc(r.id));
    // An approved pengajuan opens in its realisation: estimates locked, realised prices to enter.
    if (doc.type === 'prz' && doc.status !== 'Draft') startRealization(doc, todayIso());
    ui.form = { mode: 'edit', doc, dirty: false, errors: {} };
  }
  if (r.page === 'copy') ui.form = { mode: 'new', doc: copyOf(getSo(r.id)), dirty: true, errors: {}, from: r.id };
  render(keepScroll ? 'keep' : 'top');
}
/** "Salin": a new Draft with the same customer and lines, dated today, without the customer's PO reference. */
function copyOf(src) {
  const d = structuredClone(src);
  const date = todayIso();
  Object.assign(d, { id: '', no: '', status: 'Draft', date, poNo: '', poDate: '', history: [],
    reqDate: fmt.addDays(date, 3) });
  return d;
}

  }
  let body;
  if (open && ui.pk[key].searchable) body = `<input class="cbq" data-k="q:${key}" data-q="${key}" value="${esc(ui.pop.query)}" placeholder="${esc(sel ? (sel.code ? sel.code + ' – ' + sel.label : sel.label) : placeholder)}" autocomplete="off">`;

/* ============================================================ list card
   One shared register: toolbar (search, filters, clear, count), table, pager. */
function listState(key) { return (ui.lists[key] ||= { q: '', f: {}, page: 1, per: 25, sort: null }); }
function listCard({ key, rows, cols, text, filters = [], empty, rowGo, actions, word = 'dokumen', placeholder, sortable = false }) {
  const st = listState(key);
  let out = rows.slice();
  for (const f of filters) if (st.f[f.key]) out = out.filter((r) => f.test(r, st.f[f.key]));
  const q = st.q.trim().toLowerCase();
  if (q) out = out.filter((r) => text(r).toLowerCase().includes(q));
  if (sortable && st.sort) {
    const c = cols[st.sort.col];
    out.sort((a, b) => { const x = c.sort(a), y = c.sort(b); return (x > y ? 1 : x < y ? -1 : 0) * (st.sort.dir === 'asc' ? 1 : -1); });
  }
  const pages = Math.max(1, Math.ceil(out.length / st.per));
  const cur = Math.min(st.page, pages);
  const from = (cur - 1) * st.per;
  const pageRows = out.slice(from, from + st.per);
  const active = filters.filter((f) => st.f[f.key]).length + (st.q ? 1 : 0);

  const tools = [searchField(key, st.q, placeholder || `Cari ${word}…`)];
  for (const f of filters) {
    tools.push(picker(`flt.${key}.${f.key}`, {
      value: st.f[f.key] || '', variant: 'toolbar', set: Boolean(st.f[f.key]),
      options: [{ value: '', label: `${f.label}: semua` }, ...f.options],
      onPick: (v) => { st.f[f.key] = v; st.page = 1; },
    }));
  }
  if (active) tools.push(`<button class="btn sm ghost" data-act="clearFilters" data-list="${key}">Bersihkan filter (${active})</button>`);
  tools.push('<div class="tspace"></div>', `<span class="count"><b>${out.length}</b> dari ${rows.length} ${word}</span>`);

  const head = `<tr><th style="width:38px">No</th>${cols.map((c, i) => {
    const s = sortable && c.sort;
    const act = s && st.sort && st.sort.col === i;
    return `<th class="${c.num ? 'num ' : ''}${s ? 'srt' : ''}${act ? ' act' : ''}"${c.w ? ` style="width:${c.w}px"` : ''}${s ? ` data-act="sort" data-list="${key}" data-col="${i}"` : ''}>${c.h}${s ? `<span class="ar">${act && st.sort.dir === 'desc' ? '▼' : '▲'}</span>` : ''}</th>`;
  }).join('')}${actions ? '<th style="width:88px"></th>' : ''}</tr>`;
  const body = pageRows.map((r, i) => `<tr data-row="${rowGo(r)}"><td class="no">${from + i + 1}</td>${cols.map((c) => `<td class="${c.num ? 'num ' : ''}${c.cls || ''}">${c.cell(r)}</td>`).join('')}${actions ? `<td class="acts"><span class="ract">${actions(r)}</span></td>` : ''}</tr>`).join('');

  let table;
  if (out.length) {
    table = `<div class="tw"><table class="grid"><thead>${head}</thead><tbody>${body}</tbody></table></div>
      <div class="pager"><span class="inf">Halaman <b>${cur}</b> dari <b>${pages}</b> (${out.length} total)</span>
      ${picker(`pp.${key}`, { value: String(st.per), variant: 'compact', options: [10, 25, 50, 100].map((n) => ({ value: String(n), label: `Tampil ${n}` })), onPick: (v) => { st.per = Number(v); st.page = 1; } })}
      <div class="pgs"><button class="pg" data-act="page" data-list="${key}" data-p="1" ${cur <= 1 ? 'disabled' : ''}>«</button><button class="pg" data-act="page" data-list="${key}" data-p="${cur - 1}" ${cur <= 1 ? 'disabled' : ''}>‹</button><span class="pg on">${cur}</span><button class="pg" data-act="page" data-list="${key}" data-p="${cur + 1}" ${cur >= pages ? 'disabled' : ''}>›</button><button class="pg" data-act="page" data-list="${key}" data-p="${pages}" ${cur >= pages ? 'disabled' : ''}>»</button></div></div>`;
  } else if (rows.length) {
    table = `<div class="tw"><table class="grid"><thead>${head}</thead></table></div>` + emptyState({ ic: 'srch', title: 'Tidak ada data yang cocok', body: 'Ubah kata kunci atau bersihkan filter yang sedang aktif.', cta: `<button class="btn" data-act="clearFilters" data-list="${key}">Bersihkan filter</button>` });
  } else {
    table = `<div class="tw"><table class="grid"><thead>${head}</thead></table></div>` + emptyState(empty);
  }
  return `<div class="card"><div class="toolbar">${tools.join('')}</div>${table}</div>`;
}

/* ============================================================ overlays */
function renderLayer() {
  const layer = document.getElementById('layer');

function renderPop() {
  const el = document.getElementById('pop');
  const anchor = document.getElementById('pk-' + ui.pop.key);
  if (!el || !anchor) { ui.pop = null; return; }
  let inner, cls = 'cbpop', width;
  if (ui.pop.kind === 'pick') {
    const p = ui.pk[ui.pop.key];
    const terms = (ui.pop.query || '').toLowerCase().split(/\s+/).filter(Boolean);
    const vis = p.options.map((o, i) => ({ o, i })).filter(({ o }) => terms.every((t) => `${o.code || ''} ${o.label} ${o.hint || ''} ${o.group || ''}`.toLowerCase().includes(t)));
    ui.pop.visible = vis.map((x) => x.i);
    inner = `<div class="l" role="listbox">${vis.length ? vis.map(({ o, i }, n) => `${o.group && o.group !== (vis[n - 1] || {}).o?.group ? `<div class="cbgh">${esc(o.group)}</div>` : ''}<div class="cbo${String(o.value) === String(p.current) ? ' sel' : ''}${o.disabled ? ' off' : ''}" data-opt="${i}"${o.why ? ` title="${esc(o.why)}"` : ''}>${o.code ? `<span class="lab">${esc(o.code)}</span>` : ''}<span class="nm">${esc(o.label)}</span>${o.hint ? `<span class="lab">${esc(o.hint)}</span>` : ''}${String(o.value) === String(p.current) ? `<span class="tick">${icon('check', 13)}</span>` : ''}</div>`).join('') : '<div class="cbe">Tidak ada pilihan yang cocok.</div>'}</div>`;
  } else {
    cls = 'cbpop cal';
    inner = calendarHtml();
    width = 258;
  }
  el.className = cls;
  el.innerHTML = inner;
  const r = anchor.getBoundingClientRect();
  const w = width || Math.max(r.width, (ui.pk[ui.pop.key] && ui.pk[ui.pop.key].popWidth) || 200);
  el.style.width = w + 'px';
  el.style.maxWidth = (ui.pop.kind === 'pick' ? Math.max(w, 320) : w) + 'px';
  el.style.left = Math.min(r.left, window.innerWidth - w - 8) + 'px';
  const below = window.innerHeight - r.bottom - 10, above = r.top - 10;
  const h = Math.min(el.scrollHeight, 340);
  if (below < h && above > below) { el.style.top = ''; el.style.bottom = (window.innerHeight - r.top + 5) + 'px'; el.style.maxHeight = Math.min(340, above) + 'px'; }
  else { el.style.bottom = ''; el.style.top = (r.bottom + 5) + 'px'; el.style.maxHeight = Math.min(340, below) + 'px'; }
}
function calendarHtml() {
  const { cursor, key } = ui.pop;
  const selected = ui.dt[key] ? ui.dt[key].value : '';
  const today = todayIso();
  const first = new Date(Date.UTC(cursor.y, cursor.m, 1));
  const lead = (first.getUTCDay() + 6) % 7;
  const count = new Date(Date.UTC(cursor.y, cursor.m + 1, 0)).getUTCDate();
  const cells = Array(lead).fill('<span></span>');
  for (let d = 1; d <= count; d += 1) {
    const iso = `${cursor.y}-${fmt.pad2(cursor.m + 1)}-${fmt.pad2(d)}`;
    cells.push(`<button type="button" class="cal-c${iso === selected ? ' sel' : ''}${iso === today ? ' now' : ''}" data-day="${iso}">${d}</button>`);
  }
  return `<div class="cal-h"><button type="button" class="pg" data-calnav="-12" title="Tahun sebelumnya">«</button><button type="button" class="pg" data-calnav="-1" title="Bulan sebelumnya">‹</button><span class="cal-t">${MONTHS[cursor.m]} ${cursor.y}</span><button type="button" class="pg" data-calnav="1" title="Bulan berikutnya">›</button><button type="button" class="pg" data-calnav="12" title="Tahun berikutnya">»</button></div>
  <div class="cal-g">${['Sn', 'Sl', 'Rb', 'Km', 'Jm', 'Sb', 'Mg'].map((d) => `<span class="cal-d">${d}</span>`).join('')}${cells.join('')}</div>
  <div class="cal-f"><button type="button" class="btn sm ghost" data-day="${today}">Hari ini · ${fmt.date(today)}</button>${selected ? '<button type="button" class="btn sm ghost" data-day="">Kosongkan</button>' : ''}</div>`;
}

/* ============================================================ toasts
   Auto-dismissed after 4,2 s, manual ×; never the only place an error shows. */
function toast(title, body = '', kind = 'ok') {
  const box = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.innerHTML = `<div class="t"><b>${esc(title)}</b>${body ? `<span>${esc(body)}</span>` : ''}</div><button class="x" aria-label="Tutup">×</button>`;
  el.querySelector('.x').onclick = () => el.remove();
  box.appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

/* ============================================================ render
   A full re-render per change, keeping focus, caret and scroll where they
   were, so typing in a field feels like typing in a field. */
function render(scroll = 'keep') {
  const content = document.getElementById('content');
  const prevScroll = content ? content.scrollTop : 0;
  const a = document.activeElement;
  let focus = null;
  if (a && a.dataset && a.dataset.k) {
    const digitsRight = a.dataset.money != null ? (a.value.slice(a.selectionEnd || 0).match(/\d/g) || []).length : null;
    focus = { k: a.dataset.k, s: a.selectionStart, e: a.selectionEnd, digitsRight };
  }
  ui.pk = {}; ui.dt = {}; ui.set = {};
  let page;
  try { page = renderPage(); } catch (err) { console.error(err); page = ph({ crumb: [{ t: 'Penjualan' }, { t: 'Kesalahan' }], title: 'Terjadi kesalahan', ic: 'warn' }) + `<div class="card">${emptyState({ ic: 'warn', title: 'Halaman tidak dapat ditampilkan', body: 'Kembali ke daftar Sales Order dan coba lagi.', cta: btn('Kembali', { ic: 'back', go: 'list:sob' }) })}</div>`; }
  document.getElementById('app').innerHTML = renderShell(page);
  const c2 = document.getElementById('content');
  if (c2) c2.scrollTop = scroll === 'top' ? 0 : prevScroll;
  if (focus) {
    const el = document.querySelector(`[data-k="${CSS.escape(focus.k)}"]`);
    if (el) {
      el.focus({ preventScroll: true });
      try {
        if (focus.digitsRight != null) {
          let pos = el.value.length, seen = 0;
          while (pos > 0 && seen < focus.digitsRight) { pos -= 1; if (/\d/.test(el.value[pos])) seen += 1; }
          el.setSelectionRange(pos, pos);
        } else if (focus.s != null) el.setSelectionRange(focus.s, focus.e);
      } catch (e) { /* not a text control */ }
    }
  }
  renderLayer();
}

function docActions(d) {
  // An approved pengajuan with an advance on it can no longer be withdrawn.
  if (d.type === 'prz') return d.status === 'Draft' ? ['przApprove', 'cancel'] : d.status === 'Unrealized' ? (przAdvs(d).length ? ['realize'] : ['realize', 'cancel']) : [];
  if (['pay', 'sj', 'inv', 'ret'].includes(d.type)) return d.status === 'Draft' ? ['post', 'cancel'] : [];
  if (d.type === 'fp') return d.status === 'Draft' ? ['upload'] : d.status === 'Waiting' ? ['rtConfirm'] : d.status === 'Approved' && d.kind !== 'RT' && d.corr !== 'batal' && !d.pendingBy ? ['replace'] : [];
  if (d.type === 'bp') return d.status === 'Awaiting' || d.status === 'Revise' ? ['receive'] : [];
  // An advance that already has a payment (draft or posted) can no longer be withdrawn.
  if (d.type === 'adv') return d.status === 'Draft' ? ['issue', 'cancel'] : d.status === 'Issued' && !advPays(d).length ? ['cancel'] : [];
  if (d.status === 'Draft') return ['confirm', 'cancel'];
  if (d.status === 'Pending') return ME.roles.includes('Approver Kredit') ? ['approve', 'reject'] : [];

function runTransition(d, a) {

  }
  const s1 = secT('Customer', ed && !c ? 'pilih customer lebih dulu — isian lain mengikuti datanya' : '') + frow(custF, taxIdF, taxStF) + row2;

  const modeHint = d.mode === 'EXC' ? 'harga satuan belum termasuk PPN — PPN ditambahkan di atas DPP' : 'harga satuan sudah termasuk PPN — PPN dihitung dari dalam harga';

/* ---------- choosing a customer ---------- */
function pickCustomer(id) {
  const d = ui.form.doc;
  if (id === d.customerId) return;
  if (d.customerId && (d.lines.length || ui.form.dirty)) {
    const c = custById(id);
    ui.dialog = { kind: 'confirm', icon: 'users', tone: 't-warn', title: 'Konfirmasi Ganti Customer', subject: `${c.id} – ${c.name}`,
      body: `Identitas faktur, alamat kirim, salesperson, termin, gudang dan mode harga diisi ulang dari data ${esc(c.name)} (${MODE_TEXT[c.mode]}).${d.lines.length ? ` Harga ${d.lines.length} baris diambil ulang dari daftar harga ${esc(PRICE_GROUPS[c.group])} — harga yang diubah manual ikut diganti.` : ''}`,
      confirmLabel: 'Ya, Ganti Customer', run: () => { applyCustomer(ui.form.doc, id); touch('customerId', 'billTo', 'shipTo', 'salesId', 'termId', 'whId'); } };

    const descCell = !isB ? `<td>${ed ? textInput(`l.${i}.desc`, l.desc, 'Uraian pekerjaan…', (t) => { l.desc = t; touch('_lines'); }, { sm: true, invalid: err._lines && !(l.desc || '').trim() }) : `<span class="trunc" style="max-width:100%" title="${esc(l.desc)}">${esc(l.desc)}</span>`}</td>` : '';
    return `<tr><td class="no">${i + 1}</td><td class="pri">${itemCell(l, d, i)}</td>${descCell}
      <td>${uomCell}</td>
      <td class="num">${ed ? moneyInput(`l.${i}.qty`, l.qty, { cur: '', sm: true, onSet: (n) => setLine(i, 'qty')(n), aria: 'Qty' }) : fmt.num(l.qty)}</td>

/** The SO's own arithmetic: how PPN comes out of the chosen mode, and what the customer will actually transfer. */
function calcBoxes(d, v) {
  const c = custById(d.customerId);
  const nt = v.nonTax ? [['Penggantian biaya (NON-PPN)', fmt.money(v.nonTax)]] : [];
  const rows = d.mode === 'EXC'
    ? [['Subtotal (qty × harga)', fmt.money(v.gross0)], ['Diskon baris', fmt.money(-v.disc)], ...nt,
      ['Harga Jual (DPP)', fmt.money(v.dpp)], ['DPP Nilai Lain = 11/12 × DPP', fmt.money2(v.dppNL), 'iind'], ['PPN = 12% × DPP Nilai Lain', fmt.money(v.ppn)],
      ['Total Sales Order', fmt.money(v.total), 'itot']]
    : [['Subtotal (qty × harga)', fmt.money(v.gross0)], ['Diskon baris', fmt.money(-v.disc)], ...nt,
      ['Nilai termasuk PPN', fmt.money(v.taxBase)], ['PPN = 11/111 × nilai termasuk PPN', fmt.money(v.ppn)], ['Harga Jual (DPP) = nilai − PPN', fmt.money(v.dpp)],
      ['DPP Nilai Lain = 11/12 × DPP', fmt.money2(v.dppNL), 'iind'], ['Total Sales Order', fmt.money(v.total), 'itot']];
  let out = impact(`Perhitungan PPN · ${MODE_TEXT[d.mode]}`, rows);
  if (c && (v.pph22 || v.wapuPpn)) {
    const r2 = [['Total Sales Order', fmt.money(v.total)]];
    if (v.wapuPpn) r2.push(['PPN dipungut & disetor pembeli', fmt.money(-v.wapuPpn)]);
    if (v.pph22) r2.push([`PPh 22 dipungut (${fmt.pct(whtRate(d, c))} × DPP)`, fmt.money(-v.pph22)]);
    r2.push(['Estimasi dana diterima', fmt.money(v.cash), 'itot']);
    out = impact('Estimasi Penerimaan', r2) + out;
  }
  return out;
}

/* ============================================================ validation
   Field errors land under their field; line problems above the line table. */
function validate(d) {
  const e = {};
  const c = custById(d.customerId);
  if (!c) e.customerId = 'Pilih customer.';
  else if (c.status !== 'Active') e.customerId = c.status === 'Blocked' ? `Customer diblokir: ${c.blockReason}.` : 'Customer nonaktif — tidak dapat dipakai untuk pesanan baru.';
  if (!d.date) e.date = 'Tanggal SO wajib diisi.';
  if (c) {
    if (!d.billTo) e.billTo = 'Pilih identitas faktur.';
    if (d.kind === 'B' && !d.shipTo) e.shipTo = 'Pilih alamat kirim.';
    if (!d.salesId) e.salesId = 'Pilih salesperson.';
    if (!d.termId) e.termId = 'Pilih termin pembayaran.';
    if (d.kind === 'B' && !d.whId) e.whId = 'Pilih gudang pengirim.';
  }
  if (d.poDate && d.date && d.poDate > d.date) e.poDate = 'Tidak boleh setelah tanggal SO.';
  if (!d.reqDate) e.reqDate = 'Isi tanggal kirim yang diminta.';
  else if (d.date && d.reqDate < d.date) e.reqDate = 'Tidak boleh sebelum tanggal SO.';
  if (!d.lines.length) e._lines = `Tambahkan minimal satu ${KINDS[d.kind].noun}.`;
  else if (d.lines.some((l) => !(l.qty > 0))) e._lines = 'Setiap baris harus memiliki qty lebih dari nol.';
  else if (d.lines.some((l) => !(l.price > 0))) e._lines = 'Setiap baris harus memiliki harga satuan.';
  else if (d.kind === 'B' && d.date && d.lines.some((l) => !nieValid(itemOf(l.itemId), d.date))) e._lines = 'Ada barang yang izin edar BPOM-nya sudah berakhir pada tanggal SO.';
  return e;
}

/* ============================================================ save / cancel */
function saveForm() {
  const f = ui.form, d = f.doc;
  const errs = d.type === 'prz' ? validatePrz(d) : d.type === 'adv' ? (d.kind === 'P' ? validateUmp(d) : validateAdv(d)) : d.type === 'pay' ? validatePay(d) : d.type === 'sj' ? validateSj(d) : d.type === 'inv' ? (d.kind === 'P' ? validateIvp(d) : validateInv(d)) : d.type === 'ret' ? validateRet(d) : validate(d);
  if (Object.keys(errs).length) {
    f.errors = errs;
    const n = Object.keys(errs).filter((k) => !k.startsWith('_')).length;
    toast('Belum bisa disimpan', n ? `${n} field perlu diperbaiki.` : errs._lines || errs._form, 'err');
    render();
    return;
  }
  const at = nowStamp();
  if (f.mode === 'new') {
    if (d.type === 'prz') savePrz(d, at, ME.name); else if (d.type === 'adv') saveAdv(d, at, ME.name); else if (d.type === 'pay') savePay(d, at, ME.name); else if (d.type === 'sj') saveSj(d, at, ME.name); else if (d.type === 'inv') saveInv(d, at, ME.name); else if (d.type === 'ret') saveRet(d, at, ME.name); else saveDoc(d, at, ME.name);
    if (f.from) hist(d, at, `Disalin dari ${getSo(f.from).no}`, ME.name, '', 'copy');
    toast(`${docLabel(d)} dibuat`, `Nomor ${d.no} dibuat otomatis. Dokumen masih Draft.`);
  } else {
    const orig = getDoc(d.id);
    const rlz = d.type === 'prz' && d.status !== 'Draft', first = rlz && orig.lines.some((l) => l.real == null);
    Object.assign(orig, d, { history: orig.history });
    hist(orig, at, rlz ? (first ? 'Realisasi dicatat' : 'Realisasi diubah') : 'Diubah', ME.name, '', 'pen');
    toast(rlz ? 'Realisasi tersimpan' : 'Perubahan tersimpan', rlz && orig.status === 'Unrealized' ? `${d.no} — tekan Realisasikan untuk mengunci realisasi dan memberi nomornya.` : d.no);
  }
  go(`doc:${d.type}:${d.id}`);
}
function leaveForm() {
  const f = ui.form;
  if (f.mode === 'edit') go(`doc:${f.doc.type}:${f.doc.id}`);
  else if (f.from) go(`doc:so:${f.from}`);
  else go(`list:${leafOf(f.doc)}`);
}

function validateAdv(d) {
