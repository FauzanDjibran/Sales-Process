  if (!d.date) e.date = 'Tanggal tagihan wajib diisi.';
  else if (so && d.date < so.date) e.date = `Tidak boleh sebelum tanggal SO (${fmt.date(so.date)}).`;
  if (!d.dueDate) e.dueDate = 'Isi jatuh tempo.';
  else if (d.date && d.dueDate < d.date) e.dueDate = 'Tidak boleh sebelum tanggal tagihan.';
  if (!d.bankId) e.bankId = 'Pilih rekening pembayaran.';
  if (!(d.desc || '').trim()) e.desc = 'Uraian wajib diisi — tercetak pada tagihan.';
  if (so) {
    const room = advRoom(d);
    if (!(d.amount > 0)) e.amount = 'Isi nilai uang muka yang ditarik.';
    else if (d.amount > room.left) e.amount = room.used
      ? `Melebihi sisa yang bisa ditarik (${fmt.money(room.left)}) — ${fmt.money(room.used)} sudah ditagih uang muka lain.`

}
function askAdvTransition(d, a) {

    body = `Tagihan uang muka dikirim kepada ${esc(c.name)} dengan jatuh tempo <b>${fmt.date(d.dueDate)}</b>. Tidak ada journal: tagihan bukan transaksi — kas, kewajiban uang muka dan PPN baru tercatat saat pembayaran diterima, dan tanggal terima itu menjadi tanggal faktur pajak uang muka.`;
    extra = `<div class="apsum" style="margin-top:14px;text-align:left"><div><span>${so.type === 'prz' ? 'Pengajuan' : 'Sales Order'}</span><b class="mono">${esc(so.no)}</b></div><div><span>Mode Harga</span><b>${v.ppnable ? MODE_TEXT[d.mode] : 'NON-PPN'}</b></div>
      <div><span>DPP</span><b class="mono">${fmt.money(v.dpp)}</b></div><div><span>PPN</span><b class="mono">${fmt.money(v.ppn)}</b></div>
      <div class="full amt"><span>Total Tagihan</span><b>${fmt.money(v.total)}</b></div></div>`;
  } else {
    body = d.status === 'Issued'
      ? `Tagihan yang sudah dikirim ke ${esc(c.name)} ditarik kembali. Belum ada pembayaran yang tercatat, sehingga tidak ada journal atau faktur pajak yang dibalik. Status Dibatalkan bersifat final.`
      : 'Tagihan ditandai Dibatalkan dan tidak dapat diterbitkan. Tidak ada journal atau pajak yang terpengaruh. Status Dibatalkan bersifat final.';
  }
  ui.dialog = { kind: 'confirm', icon: T.icon, tone: T.tone === 'danger' ? 't-bad' : 't-ok', title: T.title, subject: `${d.no} – ${fmt.money(v.total)}`, body, extra, wide: a === 'issue',
    confirmLabel: T.confirmLabel, solid: T.tone === 'danger',

      else { cancelAdv(d, at, ME.name); toast('Uang muka dibatalkan', d.no); }
    } };
  renderLayer();
}

function validatePay(d) {
  const e = {};
  if (!d.purpose) { e.purpose = 'Pilih tujuan pembayaran.'; return e; }
  if (!d.date) e.date = 'Tanggal wajib diisi.';
  if (!d.bankId) e.bankId = 'Pilih rekening.';
  if (d.purpose === 'adv-ref' || d.purpose === 'ret-ref') {
    const t = payTarget(d);
    if (!t) { e.target = `Pilih ${d.purpose === 'adv-ref' ? 'uang muka' : 'nota retur'} yang dikembalikan.`; return e; }
    if (d.date && d.date < t.date) e.date = `Tidak boleh sebelum tanggal ${fmt.date(t.date)}.`;
    if (d.purpose === 'adv-ref') { if (d.status === 'Draft' && !(advUnused(t, d.id).dpp > 0)) e.target = 'Tidak ada sisa uang muka yang bisa dikembalikan.'; }
    else if (!(d.received > 0)) e.received = 'Isi dana yang ditransfer.';
    else if (d.received > retCreditLeft(t, d.id)) e.received = `Melebihi kredit tersisa ${fmt.money(retCreditLeft(t, d.id))}.`;
    return e;
  }
  if (d.purpose === 'prz-cost') {
    const t = payTarget(d);
    if (!t) { e.target = 'Pilih realisasi perizinan yang biayanya dibayar.'; return e; }
    if (!['Realized', 'Done'].includes(t.status)) e.target = 'Perizinan harus sudah direalisasi.';
    if (d.date && d.date < t.rlzDate) e.date = `Tidak boleh sebelum tanggal realisasi (${fmt.date(t.rlzDate)}).`;
    if (!(d.received > 0)) e.received = 'Isi dana yang dibayarkan.';
    else if (d.received > przCostLeft(t, d.id)) e.received = `Melebihi sisa biaya ${fmt.money(przCostLeft(t, d.id))}.`;
    return e;
  }
  if (baseP(d) === 'adv' || baseP(d) === 'inv') {
    const t = payTarget(d);
    if (!t) { e.target = `Pilih ${baseP(d) === 'adv' ? 'uang muka' : 'faktur'} yang dibayar.`; return e; }
    if (t.type === 'adv' && t.status !== 'Issued') e.target = 'Uang muka harus berstatus Diterbitkan.';
    if (t.type === 'inv' && t.status !== 'Posted') e.target = 'Faktur harus sudah diposting.';
    if (d.date && d.date < t.date) e.date = `Tidak boleh sebelum tanggal ${t.type === 'adv' ? 'tagihan' : 'faktur'} (${fmt.date(t.date)}).`;
    const f = targetFigures(d);
    if (!(d.received > 0)) e.received = 'Isi dana yang diterima.';
    else if (paySettles(d) > f.open) e.received = `Dana + potongan melebihi sisa tagihan ${fmt.money(f.open)}.`;
  } else {
    if (!(d.note || '').trim()) e.note = 'Keterangan wajib diisi.';
    if (!d.lines.length) e._lines = 'Tambahkan minimal satu account.';
    else if (d.lines.some((l) => !(l.amount > 0))) e._lines = 'Setiap baris harus memiliki jumlah.';
  }
  return e;
}

function validateInv(d) {

  const other = invOfSj(d.sjId);

  if (!d.date) e.date = 'Tanggal faktur wajib diisi.';
  else if (d.date < sj.date) e.date = `Tidak boleh sebelum tanggal kirim (${fmt.date(sj.date)}).`;
  const g = calcSo(d);
  const over = d.deds.find((y) => y.dpp > advAvailable(getDoc(y.advId), d.id));
  if (over) e.deds = `${getDoc(over.advId).no} melebihi uang muka yang tersedia (${fmt.money(advAvailable(getDoc(over.advId), d.id))}).`;
  else if (sum(d.deds, (y) => y.dpp) > g.dpp) e.deds = `Uang muka yang dipotong melebihi nilai barang (${fmt.money(g.dpp)}).`;
  return e;
}

    if (!d.rlzDate || d.lines.some((l) => l.real == null)) { toast('Isi realisasi dulu', 'Catat harga sebenarnya setiap perizinan sebelum merealisasikan.', 'warn'); go(`edit:prz:${d.id}`); return; }
    const errs = validatePrz(d);
    if (Object.keys(errs).length) { toast('Belum bisa direalisasi', Object.values(errs)[0], 'err'); go(`edit:prz:${d.id}`); ui.form.errors = errs; render(); return; }
    const x = przCalc(d, 'real'), added = d.lines.filter((l) => l.added).length;
    subject = `${d.no} – ${fmt.money(x.total)}`;
    body = `Harga setiap perizinan dikunci pada nilai realisasi dan nomor realisasi dibuat, bertanggal ${fmt.date(d.rlzDate)}. Realisasi menjadi dasar pembayaran biaya perizinan (Pembayaran · Biaya Perizinan, tanpa pajak) dan Invoice Perizinan yang memotong uang muka. Tidak ada journal — biaya dibukukan saat dibayar, pendapatan saat invoice diposting.`;
    extra = `<div class="apsum" style="margin-top:14px;text-align:left"><div><span>DPP Estimasi</span><b class="mono">${fmt.money(e.dpp)}</b></div><div><span>DPP Realisasi</span><b class="mono">${fmt.money(x.dpp)}</b></div>
      <div><span>Selisih DPP</span><b class="mono">${fmt.money(x.dpp - e.dpp)}</b></div><div><span>Perizinan</span><b>${d.lines.length}${added ? ` (${added} tambahan)` : ''}</b></div>
      <div class="full amt"><span>Total Realisasi</span><b>${fmt.money(x.total)}</b></div></div>`;
  } else {
    body = d.status === 'Unrealized'
      ? 'Pengajuan yang sudah disetujui dibatalkan dan tidak dapat dipakai untuk uang muka maupun realisasi. Tidak ada journal atau pajak yang dibalik. Status Dibatalkan bersifat final.'
      : 'Pengajuan ditandai Dibatalkan dan tidak dapat disetujui lagi. Tidak ada journal atau pajak yang terpengaruh. Status Dibatalkan bersifat final.';
  }
  ui.dialog = { kind: 'confirm', icon: T.icon, tone: T.tone === 'danger' ? 't-bad' : 't-ok', title: T.title, subject, body, extra, wide: a !== 'cancel',
    confirmLabel: T.confirmLabel, solid: T.tone === 'danger',
    run: () => {
      const at = nowStamp();
      if (a === 'przApprove') { approvePrz(d, at, ME.name); toast('Pengajuan disetujui', `${d.no} — siap ditagihkan uang muka perizinan.`); }
      else if (a === 'realize') { realizePrz(d, at, ME.name); toast('Perizinan direalisasi', `${d.no} — nomor realisasi ${d.rlzNo}.`); }
      else { cancelPrz(d, at, ME.name); toast('Pengajuan dibatalkan', d.no); }
    } };
  renderLayer();
}

/* ============================================================ Uang Muka Perizinan — the basis card

  const table = `<div class="tw"><table class="grid ltab" style="min-width:680px"><thead><tr><th style="width:34px">No</th><th>Uraian</th><th class="num" style="width:150px">Nilai Pengajuan</th><th class="num" style="width:160px">DPP (sebelum pajak)</th></tr></thead><tbody>
    <tr><td class="no">1</td><td class="pri"><span class="dstack"><span class="d1">Jasa pengurusan perizinan</span><span class="d2">${esc(src.no)} · ${esc(src.product)} · ${src.lines.length} perizinan</span></span></td><td class="num">${mny(e.base)}</td><td class="num">${mny(e.dpp)}</td></tr></tbody>
    <tfoot><tr class="totrow"><td colspan="3" style="text-align:right">Total DPP pengajuan</td><td class="num"><span class="mny big">${fmt.money(e.dpp)}</span></td></tr></tfoot></table></div>`;
  const amtLabel = d.mode === 'EXC' ? 'Uang Muka Ditarik (DPP)' : 'Uang Muka Ditarik (termasuk PPN)';
  const amtHelp = ed ? `maks ${fmt.money(room.left)}${room.used ? ` — ${fmt.money(room.used)} sudah ditagih uang muka lain` : ''}` : '';
  const amtF = field({ label: amtLabel, span: 6, req: ed, help: amtHelp, err: err.amount },
    ed ? moneyInput('f.amount', d.amount, { invalid: !!err.amount, over: d.amount > room.left, onSet: (n) => { ui.form.doc.amount = n; touch('amount'); }, aria: amtLabel }) : ro(`<span class="mny">${fmt.money(d.amount)}</span>`));
  const pctF = field({ label: 'Porsi dari DPP Pengajuan', span: 6 }, ro(`${fmt.pct(pct)} <span class="rx">DPP uang muka ${fmt.money(v.dpp)} dari ${fmt.money(e.dpp)}</span>`));
  const sub = d.mode === 'EXC'
    ? 'Nilai pengajuan sebagai satu baris, lalu satu nilai uang muka yang ditarik darinya (sebelum PPN) — biasanya penuh. DPP Nilai Lain dan PPN dihitung dari nilai uang muka.'
    : 'Nilai pengajuan sebagai satu baris, lalu satu nilai uang muka yang ditarik darinya (sudah termasuk PPN) — biasanya penuh. DPP, DPP Nilai Lain dan PPN dihitung dari nilai uang muka.';
  return `<div class="card">${cardH('calc', 'Dasar Uang Muka', sub)}${table}${fbody(frow(amtF, pctF))}<div class="cardfoot multi">${advBoxes(d, v, { dpp: e.dpp, pct })}</div></div>`;
}
function validateUmp(d) {
  const e = {}, src = getDoc(d.soId);
  if (!src) e.soId = 'Pilih pengajuan perizinan.';
  else if (!['Unrealized', 'Realized'].includes(src.status)) e.soId = 'Pengajuan harus sudah disetujui dan belum ditagih.';
  if (!d.date) e.date = 'Tanggal tagihan wajib diisi.';
  else if (src && d.date < src.date) e.date = `Tidak boleh sebelum tanggal pengajuan (${fmt.date(src.date)}).`;
  if (!d.dueDate) e.dueDate = 'Isi jatuh tempo.';
  else if (d.date && d.dueDate < d.date) e.dueDate = 'Tidak boleh sebelum tanggal tagihan.';
  if (!d.bankId) e.bankId = 'Pilih rekening pembayaran.';
  if (!(d.desc || '').trim()) e.desc = 'Uraian wajib diisi — tercetak pada tagihan.';
  if (src) {
    const room = advRoom(d);
    if (!(d.amount > 0)) e.amount = 'Isi nilai uang muka yang ditarik.';
    else if (d.amount > room.left) e.amount = room.used
      ? `Melebihi sisa yang bisa ditarik (${fmt.money(room.left)}) — ${fmt.money(room.used)} sudah ditagih uang muka lain.`
      : `Melebihi nilai pengajuan (${fmt.money(room.value)}).`;
  }
  return e;
}

  const custF = field({ label: 'Customer', span: 6 }, c ? ro(custRef(c)) : roNil('menunggu Realisasi'));
  const ent = c && c.entities.find((e) => e.id === d.billTo);

  const billF = field({ label: 'Identitas Faktur', span: 6 }, ent ? ro(`<span class="lab">${esc(ent.nitku || ent.nik)}</span><span>${esc(ent.label)}</span>`) : roNil('menunggu Realisasi'));
  const dateF = field({ label: 'Tanggal Invoice', span: 4, req: ed, help: ed && src ? 'faktur pajak bertanggal invoice' : '', err: err.date }, ed ? dateInput('f.date', d.date, { invalid: !!err.date, onPick: setDoc('date') }) : ro(fmt.date(d.date)));
  const dueF = field({ label: 'Jatuh Tempo', span: 4, help: ed && src ? termById(d.termId).label : '' }, src ? ro(`${fmt.date(invDue(d))}${invOverdue(d) ? ' ' + tag('Lewat jatuh tempo', 't-bad') : ''}`) : roNil('menunggu Realisasi'));
  const modeF = field({ label: 'Mode Harga', span: 4 }, src ? ro(modeTag(d.mode)) : roNil('menunggu Realisasi'));

function validateIvp(d) {
  const e = {}, src = getDoc(d.soId);
  if (!src) { e.soId = 'Pilih realisasi perizinan.'; return e; }
  if (src.status !== 'Realized') e.soId = 'Perizinan harus sudah direalisasi dan belum ditagih.';
  const other = przInv(src);
  if (other && other.id !== d.id) e.soId = `Realisasi sudah ditagih di ${other.no}.`;
  if (!d.date) e.date = 'Tanggal invoice wajib diisi.';
  else if (d.date < src.rlzDate) e.date = `Tidak boleh sebelum tanggal realisasi (${fmt.date(src.rlzDate)}).`;
  const g = przCalc(src, 'real');
  const over = d.deds.find((y) => y.dpp > advAvailable(getDoc(y.advId), d.id));
  if (over) e.deds = `${getDoc(over.advId).no} melebihi uang muka yang tersedia (${fmt.money(advAvailable(getDoc(over.advId), d.id))}).`;
  else if (sum(d.deds, (y) => y.dpp) > g.dpp) e.deds = `Uang muka yang dipotong melebihi nilai realisasi (${fmt.money(g.dpp)}).`;
  return e;
}

/* ============================================================ actions */
const ACTIONS = {
  openSub() { ui.subOpen = true; },
  burger() { ui.navOpen = !ui.navOpen; render(); },
  collapseSub() { ui.subOpen = false; render(); },
  user() { ui.userOpen = !ui.userOpen; render(); },
  resetDemo() {
    ui.userOpen = false;
    ui.dialog = { kind: 'confirm', icon: 'refresh', tone: 't-bad', title: 'Konfirmasi Muat Ulang Data', subject: 'Seluruh dokumen transaksi',
      body: 'Sales Order, pengajuan perizinan, surat jalan, faktur, invoice, nota retur, uang muka, pembayaran, dokumen pajak dan journal yang dibuat atau diubah sejak halaman dibuka dihapus, dan data kembali ke kondisi awal. Master data tidak berubah.', confirmLabel: 'Ya, Muat Ulang', solid: true,
      run: () => { seed(); ui.lists = {}; toast('Data awal dimuat ulang', 'Dokumen dan journal kembali ke kondisi awal.'); ui.after = 'list:sob'; } };
    render();
  },
  kpiList(el) {
    const st = listState(el.dataset.list);
    st.f = { [el.dataset.f]: el.dataset.v }; st.q = ''; st.page = 1;
    go(`list:${el.dataset.list}`, true);
  },
  clearSearch(el) { const st = listState(el.dataset.list); st.q = ''; st.page = 1; render(); },
  clearFilters(el) { const st = listState(el.dataset.list); st.q = ''; st.f = {}; st.page = 1; render(); },
  page(el) { listState(el.dataset.list).page = Number(el.dataset.p); render(); },
  sort(el) {
    const st = listState(el.dataset.list), col = Number(el.dataset.col);
    st.sort = !st.sort || st.sort.col !== col ? { col, dir: 'asc' } : st.sort.dir === 'asc' ? { col, dir: 'desc' } : null;
    render();
  },
  rowMenu(el) {
    const r = el.getBoundingClientRect();
    ui.menu = { id: el.dataset.id, x: r.right - 200, y: r.bottom + 5 };
    renderLayer();
  },
  askTransition(el) { askTransition(el.dataset.id, el.dataset.a); },
  closeDialog() { if (ui.dialog && !ui.dialog.busy) { ui.dialog = null; renderLayer(); } },
  confirmDialog() {
    const d = ui.dialog;
    d.busy = true;
    renderLayer();
    setTimeout(() => {
      ui.dialog = null;
      d.run();
      if (ui.after) { const to = ui.after; ui.after = null; go(to); } else render();
    }, 380);
  },
  cancelForm() {
    if (!ui.form.dirty) { leaveForm(); return; }
    ui.dialog = { kind: 'confirm', icon: 'warn', tone: 't-bad', title: 'Konfirmasi Buang Perubahan', subject: ui.form.doc.no || `${docLabel(ui.form.doc)} Baru`,
      body: 'Perubahan yang belum disimpan akan hilang dan dokumen kembali seperti sebelum diubah.', confirmLabel: 'Ya, Buang Perubahan', solid: true,
      run: () => { ui.form.dirty = false; leaveForm(); } };
    renderLayer();
  },
  saveForm() { saveForm(); },
  pickItems() { ui.dialog = { kind: 'items', sel: [] }; renderLayer(); },
  toggleItem(el) { const s = ui.dialog.sel, id = el.dataset.item; const i = s.indexOf(id); if (i >= 0) s.splice(i, 1); else s.push(id); renderLayer(); },
  addItems() {
    const d = ui.form.doc;
    ui.dialog.sel.forEach((id) => {
      const it = itemOf(id);
      const l = { itemId: id, uom: it.uoms[0].u, qty: 1, disc: 0 };
      l.price = listPrice(d, l);
      l.wht = whtAllowed(d, custById(d.customerId), l);
      d.lines.push(l);
    });
    ui.dialog = null; touch('_lines');
    render();
  },
  pickAccounts() { ui.dialog = { kind: 'accts', sel: [] }; renderLayer(); },
  toggleAcc(el) { const s = ui.dialog.sel, c = el.dataset.acc; const i = s.indexOf(c); if (i >= 0) s.splice(i, 1); else s.push(c); renderLayer(); },
  addAccounts() { ui.dialog.sel.forEach((acc) => ui.form.doc.lines.push({ acc, amount: 0, memo: '' })); ui.dialog = null; touch('_lines'); render(); },
  removePayLine(el) { ui.form.doc.lines.splice(Number(el.dataset.i), 1); touch('_lines'); render(); },
  confirmBp() {
    const dlg = ui.dialog, b = getDoc(dlg.id), e = {};
    if (!(dlg.bpNo || '').trim()) e.bpNo = 'Isi nomor bukti potong.';
    if (!dlg.bpDate) e.bpDate = 'Isi tanggal bukti potong.';
    else if (dlg.bpDate < b.date) e.bpDate = `Tidak boleh sebelum tanggal potong (${fmt.date(b.date)}).`;
    if (dlg.amount !== b.amount) e.amount = `Berbeda dengan PPh yang dipotong (${fmt.money(b.amount)}) — minta customer membetulkan bukti potongnya.`;
    if (Object.keys(e).length) { dlg.errors = e; renderLayer(); return; }
    receiveBp(b, { bpNo: dlg.bpNo.trim(), bpDate: dlg.bpDate, amount: dlg.amount }, nowStamp(), ME.name);
    ui.dialog = null;
    toast('Bukti potong diterima', `${b.bpNo} — PPh ${fmt.money(b.amount)} dapat dikreditkan.`);
    render();
  },
  removeSjLine(el) { ui.form.doc.lines.splice(Number(el.dataset.i), 1); touch('_lines'); render(); },
  goSob() { const st = listState('sob'); st.f = { status: 'Open' }; st.q = ''; st.page = 1; go('list:sob'); },
  toggleWht(el, e) { e.preventDefault(); const l = ui.form.doc.lines[Number(el.dataset.i)]; l.wht = !l.wht; touch('_lines'); render(); },
  confirmSoClose() {
    const dlg = ui.dialog, so = getDoc(dlg.id);
    if (!(dlg.reason || '').trim()) { dlg.err = 'Isi alasan penutupan.'; renderLayer(); return; }
    closeSo(so, dlg.reason.trim(), nowStamp(), ME.name); ui.dialog = null;
    toast('Pesanan ditutup', `${so.no} — Selesai; sisa tidak dikirim.`); render();
  },
  confirmFpReplace() {
    const dlg = ui.dialog, f = getDoc(dlg.id);
    if (!(dlg.reason || '').trim()) { dlg.err = 'Isi alasan penggantian.'; renderLayer(); return; }
    const x = fpCorrection(f, { dpp: f.dpp, ppn: f.ppn, corr: 'pengganti', billTo: dlg.billTo, desc: dlg.desc, reason: dlg.reason.trim() }, nowStamp(), ME.name);
    ui.dialog = null; toast('Faktur pengganti dibuat', `${x.no} — Draft, upload ke Coretax untuk menggantikan ${f.no}.`); go(`doc:fp:${x.id}`);
  },
  removeLine(el) { ui.form.doc.lines.splice(Number(el.dataset.i), 1); touch('_lines'); render(); },
  pickIzins() { ui.dialog = { kind: 'izins', sel: [] }; renderLayer(); },
  toggleIzin(el) { const s = ui.dialog.sel, id = el.dataset.izin; const i = s.indexOf(id); if (i >= 0) s.splice(i, 1); else s.push(id); renderLayer(); },
  addIzins() {
    const d = ui.form.doc, rz = d.status !== 'Draft';
    // During the realisation a permit is new: its estimate is 0 and the standard price is its first realised price.
    ui.dialog.sel.forEach((id) => { const p = permitOf(id), price = permitEst(p, d.mode); d.lines.push({ izinId: id, desc: p.desc, est: rz ? 0 : price, real: rz ? price : null, added: rz }); });
    ui.dialog = null; touch('_lines');
    render();
  },
  removePrzLine(el) { ui.form.doc.lines.splice(Number(el.dataset.i), 1); touch('_lines'); render(); },
  modeChoice(el) { ui.dialog.choice = el.dataset.v; renderLayer(); },
  applyMode() {
    const d = ui.form.doc, dlg = ui.dialog;
    if (dlg.choice === 'list') d.lines.forEach((l) => { l.price = listPrice(d, l, dlg.to); });
    d.mode = dlg.to;
    ui.dialog = null; touch();
    toast(`Mode harga diubah ke ${MODE_TEXT[d.mode]}`, dlg.choice === 'list' ? 'Harga satuan diambil ulang dari daftar harga.' : 'Angka harga satuan dipertahankan.');
    render();
  },
};

/* ============================================================ popovers */
function closePop() {
  if (!ui.pop) return;
  const key = ui.pop.key, kind = ui.pop.kind;
  ui.pop = null;
  const pop = document.getElementById('pop');
  if (pop) pop.remove();
  const trig = document.getElementById('pk-' + key);
  if (kind === 'pick' && trig && trig.classList.contains('open')) {
    trig.classList.remove('open');
    const p = ui.pk[key], sel = p && p.options.find((o) => String(o.value) === String(p.current));
    const q = trig.querySelector('.cbq');
    if (q) q.outerHTML = sel ? `<span class="v">${sel.code ? `<span class="lab">${esc(sel.code)}</span>` : ''}<span class="nm">${esc(sel.label)}</span></span>` : `<span class="v"><span class="ph">${esc((p && p.placeholder) || 'Pilih…')}</span></span>`;
  }
}
function openPick(key) {
  ui.pop = { kind: 'pick', key, query: '' };
  render();
  const q = document.querySelector(`[data-q="${CSS.escape(key)}"]`);
  if (q) q.focus();
}
function pickOption(i) {
  const p = ui.pk[ui.pop.key], o = p.options[i];
  if (!o || o.disabled) return;
  ui.pop = null;
  p.onPick(o.value);
  render();
}
function openCal(key) {
  const v = ui.dt[key] ? ui.dt[key].value : '';
  const base = v ? new Date(v + 'T00:00:00Z') : new Date();
  ui.pop = { kind: 'cal', key, text: null, cursor: { y: base.getUTCFullYear(), m: base.getUTCMonth() } };
  renderLayer();
}
function commitDate(key, text) {
  const reg = ui.dt[key];
  if (!reg) return false;
  const iso = fmt.toIso(text);
  if (iso) { reg.onPick(iso); return true; }
  if (!text.trim()) { reg.onPick(''); return true; }
  return false;
}

/* ============================================================ event wiring */
document.addEventListener('mousedown', (e) => {
  const t = e.target;
  const opt = t.closest('[data-opt]');
  if (opt) { e.preventDefault(); ui.pickedAt = Date.now(); pickOption(Number(opt.dataset.opt)); return; }
  const day = t.closest('[data-day]');
  if (day) {
    e.preventDefault();
    const key = ui.pop.key; ui.pop = null; ui.pickedAt = Date.now();
    ui.dt[key].onPick(day.dataset.day);
    render();
    return;
  }
  const nav = t.closest('[data-calnav]');
  if (nav) { e.preventDefault(); const c = ui.pop.cursor; const d = new Date(Date.UTC(c.y, c.m + Number(nav.dataset.calnav), 1)); ui.pop.cursor = { y: d.getUTCFullYear(), m: d.getUTCMonth() }; renderPop(); return; }
  if (ui.pop && !t.closest('#pop') && !t.closest('#pk-' + CSS.escape(ui.pop.key))) closePop();
  if (ui.menu && !t.closest('#rowmenu') && !t.closest('[data-act="rowMenu"]')) { ui.menu = null; const m = document.getElementById('rowmenu'); if (m) m.remove(); }
  if (ui.userOpen && !t.closest('#uchip')) { ui.userOpen = false; const m = document.querySelector('.umenu'); if (m) m.remove(); }
  if (t.dataset && t.dataset.ovl && ui.dialog && !ui.dialog.busy) { ui.dialog = null; renderLayer(); }
}, true);

document.addEventListener('click', (e) => {
  // The click that ends a mousedown which already picked an option or a day must not reopen what sits beneath it.
  if (ui.pickedAt && Date.now() - ui.pickedAt < 400) { ui.pickedAt = 0; return; }
  const t = e.target;
  const cal = t.closest('[data-cal]');
  if (cal) { if (ui.pop && ui.pop.key === cal.dataset.cal) closePop(); else openCal(cal.dataset.cal); return; }
  const pk = t.closest('[data-pk]');
  if (pk) { if (t.closest('.cbq')) return; if (ui.pop && ui.pop.key === pk.dataset.pk) { closePop(); } else openPick(pk.dataset.pk); return; }
  const el = t.closest('[data-go],[data-act],[data-row]');
  if (!el || el.disabled) return;
  if (el.dataset.act) {
    const fn = ACTIONS[el.dataset.act];
    if (fn) fn(el, e);
    if (el.dataset.go) go(el.dataset.go);
    return;
  }
  if (el.dataset.go) { go(el.dataset.go); return; }
  if (el.dataset.row && !window.getSelection().toString()) go(el.dataset.row);
});

document.addEventListener('input', (e) => {
  const t = e.target, ds = t.dataset;
  if (ds.q != null) { ui.pop.query = t.value; renderPop(); return; }
  if (ds.search != null) { const st = listState(ds.search); st.q = t.value; st.page = 1; render(); return; }
  if (ds.date != null) { const m = fmt.mask(t.value); t.value = m; if (ui.pop && ui.pop.key === ds.date) ui.pop.text = m; return; }
  if (ds.money != null) { const raw = t.value.replace(/\D/g, ''); const fn = ui.set[ds.money]; if (fn) fn(raw === '' ? 0 : Number(raw)); render(); return; }
  if (ds.pct != null) {
    // Digits and one decimal comma, at most two decimals, never above 100.
    let txt = t.value.replace(/\./g, ',').replace(/[^\d,]/g, '');
    const [a, ...b] = txt.split(',');
    txt = b.length ? `${a},${b.join('').slice(0, 2)}` : a;
    let n = Number(txt.replace(',', '.')) || 0;
    if (n > 100) { n = 100; txt = '100'; }
    ui.pct = { key: ds.pct, text: txt };
    const fn = ui.set[ds.pct]; if (fn) fn(n);
    render(); return;
  }
  if (ds.text != null) { const fn = ui.set[ds.text]; if (fn) fn(t.value); if (ui.form && !document.querySelector('.ph-dirty')) render(); }
});

document.addEventListener('focusin', (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.date != null && !t.closest('#layer') && !(ui.pop && ui.pop.key === t.dataset.date)) openCal(t.dataset.date);
});
document.addEventListener('focusout', (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.pct != null) { ui.pct = null; return; }
  if (!(t.dataset && t.dataset.date != null)) return;
  const key = t.dataset.date;
  const before = ui.dt[key] ? ui.dt[key].value : '';
  if (!commitDate(key, t.value)) t.value = fmt.date(before);
  else if (fmt.toIso(t.value) !== before) setTimeout(() => { if (document.activeElement === document.body || !document.activeElement.dataset.k) render(); }, 250);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (ui.pop) { closePop(); e.stopPropagation(); return; }
    if (ui.menu) { ui.menu = null; renderLayer(); e.stopPropagation(); return; }
    if (ui.dialog && !ui.dialog.busy) { ui.dialog = null; renderLayer(); e.stopPropagation(); return; }
    if (ui.userOpen) { ui.userOpen = false; render(); return; }
  }
  const t = e.target, ds = t.dataset || {};
  if (e.key === 'Enter' && ds.q != null) {
    e.preventDefault();
    const first = (ui.pop.visible || []).find((i) => !ui.pk[ui.pop.key].options[i].disabled);
    if (first != null) pickOption(first);
    return;
  }
  if (e.key === 'Enter' && ds.date != null) { e.preventDefault(); const key = ds.date; ui.pop = null; if (!commitDate(key, t.value)) t.value = fmt.date(ui.dt[key].value); render(); return; }
  if ((e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown') && ds.pk != null && !(ui.pop && ui.pop.key === ds.pk)) { e.preventDefault(); openPick(ds.pk); }
}, true);

document.addEventListener('scroll', () => { if (ui.pop) renderPop(); }, true);
window.addEventListener('resize', () => { if (ui.pop) renderPop(); });

/* ============================================================ start */
seed();
go('list:sob');
</script>
