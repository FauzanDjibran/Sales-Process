   the padding is paid once, by `.fbody`. A Budget create form went from 704px
   to 390px. The 34px control height is deliberately untouched: these operators
   work by mouse, and a smaller target would cost them more than the pixels are
   worth.

   `components/ui/form.tsx` is the only thing that emits this markup. */

/* A document's heading is its number, with the status beside it, because that
   is how a document names itself — the description is a field on the form, and
   repeating it as the heading states it twice. Mono at the title's weight, and
   without the -.45px display tracking `.ph-row h1` gives a proportional face: a
   monospaced number is already evenly spaced, so negative tracking only crowds
   it. Scoped `.pad >` like every other page-header rule — `.ph` is the
   placeholder class too. */
.pad > .ph .ph-row h1 .docno{font-family:var(--f-mono);font-size:17px;font-weight:700;letter-spacing:0}

/* A closing note under a form's fields — what the record's state means for
   what has already moved. It replaced the summary card's `.sidenote`, which
   only existed because the card needed filling. */
.fnote{padding:11px 16px 13px;border-top:1px solid var(--line-2);font-size:11.5px;
  line-height:1.6;color:var(--muted);margin:0}
/* A master record is known by its name, so the name stays the heading and the
   system code sits beside it as the technical reference §9 calls it. */
.pad > .ph .ph-row h1 .docno.sm{font-size:11.5px;font-weight:600;color:var(--muted-2);
  background:var(--line-2);border-radius:5px;padding:2px 7px;letter-spacing:.02em}

/* ============================================================ ERP additions
   Classes SIBA's sheet does not have, built only from its tokens
   (Claude-ERP.md §2.3). */

/* ---------- form tabs (P38) ----------
   A record's form is a header card, then everything else in tabs, then the
   history card. The bar sits between the header card and the tab's own card;
   the active tab is underlined in the accent, as the UI reference draws it,
   and each collection tab carries its count so nobody has to open it to know
   whether it is empty. */
.tabs{display:flex;align-items:flex-end;gap:2px;margin:16px 2px 12px;border-bottom:1px solid var(--line);
  overflow-x:auto;overflow-y:hidden}
.tab{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;margin-bottom:-1px;border:0;
  border-bottom:2px solid transparent;background:none;cursor:pointer;white-space:nowrap;
  font-size:12.5px;font-weight:600;color:var(--muted)}
.tab:hover{color:var(--ink-2)}
.tab.on{color:var(--brand);font-weight:800;border-bottom-color:var(--accent-s)}
.tab .tc{min-width:20px;height:18px;padding:0 6px;border-radius:99px;background:var(--line-2);color:var(--muted-2);
  display:inline-grid;place-items:center;font-family:var(--f-mono);font-size:10px;font-weight:700}
.tab.on .tc{background:var(--brand-50);color:var(--brand)}
/* A tab holding a field the last save refused, so the error is findable
   without opening every tab. */
.tab.bad,.tab.bad.on{color:var(--bad)}
.tab .td{width:6px;height:6px;border-radius:50%;background:var(--bad-solid)}

/* A collection table inside a tab card: rows open an edit dialog only while
   the form is being edited, so a read-only row does not pretend to be a link. */
table.grid.coll tbody tr{cursor:default}
table.grid.coll tbody tr.ed{cursor:pointer}
table.grid.coll tbody td.addr{white-space:normal;line-height:1.5;min-width:280px}
table.grid.coll tbody td.addr .an{display:block;margin-top:2px;font-size:11px;color:var(--muted-2)}
.flagc{display:flex;gap:5px;flex-wrap:wrap}
/* The error of a whole collection, above its table. */
.cerr{margin:12px 16px 0}
/* Form rows inside a panel dialog: the body already pays the side padding. */
.rp-body > .frow{padding-left:0;padding-right:0}

/* ---------- discount mode toggle on a document line (P52) ----------
   Two small segments before the value: % or Rp. The chosen one takes the
   brand fill, like a pressed key. */
.dtog{display:inline-flex;flex:0 0 auto;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;height:32px}
.dtog button{border:0;background:#fff;padding:0 8px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
.dtog button + button{border-left:1px solid var(--line)}
.dtog button.on{background:var(--brand);color:#fff}
.dcell{display:flex;gap:5px;align-items:center}
.dcell .mwrap{flex:1 1 auto;min-width:0}
/* Quantity and its unit in one cell, read as "10 PCS": the amount field
   takes the room, the unit sits after it — a picker only when the item has
   more than one unit, plain text otherwise. */
.qcell{display:flex;gap:5px;align-items:center}
.qcell .mwrap{flex:1 1 auto;min-width:0}
.qcell > :not(.mwrap){flex:0 0 74px;min-width:0}
.qcell .qu{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.qview{display:inline-flex;gap:6px;align-items:baseline}
/* `th.num` means right-aligned, but `table.grid thead th` outranks it and
   set every amount's heading flush left, away from its figures. */
table.grid thead th.num{text-align:right}
/* A total row inside the impact box, and the estimate rows under it. */
.impact .ir.tot{margin-top:3px;padding-top:7px;border-top:1px solid var(--line-2)}
.impact .ir.tot span{color:var(--ink);font-weight:700}
.impact .ir.tot b{font-size:13px;color:var(--brand)}
.impact .ir.est span{color:var(--muted-2)}
/* A secondary fact beside a read-only value — a date beside a document
   number (the simulation's `.ro .rx`). */
.ro .rx{color:var(--muted-2);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* ---------- keyboard highlight in a dropdown list ----------
   ↓ / ↑ move `.cbo.hi`, and hovering moves it too, so a row the mouse merely
   rests on must not keep its own hover colour beside the highlighted one. */
.cbpop .cbo:not(.hi):not(.sel):hover{background:transparent}
.cbpop .cbo.sel.hi{background:var(--brand-50)}

/* ---------- percent field ----------
   `PercentInput`: the amount field with a `%` inside the box on the right,
   after the figure, so a percent is never read as an amount. */
.pwrap{position:relative;display:block}
.pwrap .inp.mfield{padding-right:28px}
.pwrap .pct{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:12px;
  font-weight:700;color:var(--muted-2);pointer-events:none}
.pwrap.sm .inp.mfield{padding-right:24px}
.pwrap.sm .pct{right:9px;font-size:11px}
.dcell .pwrap{flex:1 1 auto;min-width:0}

/* ---------- two impact boxes side by side (the simulation's) ----------
   The estimate on the left, the document's own figures on the right; each as
   tall as its own rows. */
.cardfoot.multi{gap:12px;flex-wrap:wrap;align-items:flex-start}

/* ---------- a confirmation that shows its consequences as a table ----------
   Posting a receipt lists the journal lines it will write before it writes
   them; the plain 384px dialog cannot hold four columns. */
.modal.wide{width:min(680px,100%)}
.modal.wide .mbody .tw{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:var(--r)}

/* ---------- the bill picker of a Penerimaan (P67, P76) ----------
   Every open bill of the partner is a row of the Pilih Tagihan dialog; an
   unticked row is dimmed but stays, so the whole list is in view. A line's
   "lunas bila …" tag is a button that fills the amount clearing the bill. */
table.ltab tr.unpicked td{color:var(--muted-2)}
table.ltab tr.unpicked .mny{color:var(--muted-3)}
table.ltab td.pick,table.ltab th.pick{width:40px;text-align:center;padding-left:8px;padding-right:8px}
table.ltab td.pick input,table.ltab th.pick input{width:15px;height:15px;accent-color:var(--brand);cursor:pointer}
table.ltab tr.clk{cursor:pointer}
.impact .ir.diff b{color:var(--bad)}
.impact .ir.ok b{color:var(--ok)}
/* A group heading row inside a picker table — the Faktur's Delivery Note per group. */
table.ltab tr.grp td{background:var(--line-3);font-weight:700;padding-top:7px;padding-bottom:7px}

/* ---------- Workspace Unit (P242) ----------
   Unit cards, queue tabs and the selection chip, as the agreed simulation drew them. */
.uw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(286px,1fr));gap:12px;margin-bottom:16px}
.uw-ws{display:flex;align-items:center;gap:9px;margin:4px 2px 9px;font-size:9.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--muted-2)}
.uw-ws::after{content:"";flex:1 1 auto;height:1px;background:var(--line)}
.uw-card{display:flex;flex-direction:column;gap:11px;min-width:0;padding:13px 14px;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-sm);cursor:pointer;text-align:left}
.uw-card:hover{box-shadow:var(--sh-md);border-color:var(--muted-3)}
.uw-card-h{display:flex;align-items:center;gap:8px;min-width:0}
.uw-card-h b{flex:1 1 auto;min-width:0;font-size:13.5px;font-weight:800;color:var(--brand);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uw-nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line-2);border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.uw-nums div{background:#fff;padding:6px 8px;min-width:0}
.uw-nums label{display:block;font-size:8.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);white-space:nowrap}
.uw-nums b{font-family:var(--f-mono);font-size:15px;font-weight:700;color:var(--brand)}
.uw-nums b.z{color:var(--muted-3);font-weight:500}
.uw-nums .hot b{color:var(--warn)}
.uw-hint{font-size:11.5px;color:var(--muted);min-width:0}
.uw-hint.bad{color:var(--bad);font-weight:600}
td.uw-note{white-space:normal;max-width:260px;font-size:11.5px;color:var(--muted)}
.qtabs{display:flex;align-items:flex-end;gap:2px;padding:0 13px;border-bottom:1px solid var(--line-2);overflow-x:auto}
.qtabs button{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 12px;border:0;background:none;font:inherit;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.qtabs button:hover{color:var(--ink)}
.qtabs button.act{color:var(--brand);font-weight:800;border-bottom-color:var(--accent-s)}
.qtabs .n{min-width:20px;height:18px;padding:0 6px;border-radius:9px;background:var(--line-2);color:var(--muted);font-size:10.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.qtabs button.act .n{background:var(--accent-100);color:var(--brand)}
table.grid th.selchk,table.grid td.selchk{width:34px;text-align:center;padding-left:8px;padding-right:4px}
table.grid .selchk input{width:15px;height:15px;accent-color:var(--brand);cursor:pointer;vertical-align:middle;margin:0}
table.grid tbody tr.sel td{background:var(--accent-50)}
.selcount{display:inline-flex;align-items:center;gap:7px;height:33px;padding:0 6px 0 11px;border-radius:var(--r);border:1px solid var(--accent-100);background:var(--accent-50);color:var(--brand);font-size:11.5px;font-weight:700;white-space:nowrap}
.selcount button{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:0;border-radius:5px;background:none;color:var(--muted);cursor:pointer}
.selcount button:hover{background:var(--accent-100);color:var(--ink)}
.kpi .i.t-acc{background:var(--accent-50);color:#8A6D08}
.uw-tags{display:flex;flex-wrap:wrap;gap:5px}
/* A heading over each of the Unit page's two tables, Job and No. Stok tanpa Job (W111). */
.uw-sec{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:14px 16px 6px;font-size:9.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--muted-2)}
.uw-sec span{margin-left:auto;font-size:10.5px;font-weight:500;letter-spacing:0;text-transform:none}
.uw-pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;padding:14px}
.uw-pair .impact{min-width:0}
.uw-nums small{display:block;font-family:var(--f-mono);font-size:10px;color:var(--muted-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* The Dampak Transaksi card of a Penerimaan / Pengeluaran (P243): what posting
   does to the Kas & Bank, labels over figures as SIBA's .lsum. */
.txsum{margin-left:auto;display:flex;align-items:stretch;flex-wrap:wrap;row-gap:10px}
.txsum > span{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:4px;padding:0 18px;border-left:1px solid var(--line)}
.txsum > span:first-child{border-left:0}
.txsum > span:last-child{padding-right:0}
.txsum i{font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-2)}
.txsum b{font-family:var(--f-mono);font-size:14px;font-weight:700;white-space:nowrap;color:var(--ink)}
.txsum .k b{font-size:16px}
.txsum .neg b{color:var(--bad)}
.txsum .mi{width:150px}

/* ---------- two applications (P254) ----------
   The picker is the login card, wider, with the two applications stacked as
   buttons. The brand block tells the open application by its mark and name;
   it keeps the brand colours, since the accent fill means "selected" (P258). */
.sso-card{max-width:540px}
.sso-apps{display:flex;flex-direction:column;gap:10px}
.sso-app{display:flex;align-items:center;gap:13px;width:100%;padding:13px 14px;border:1px solid var(--line);
  border-radius:var(--r-lg);background:var(--surface);color:var(--muted-2)}
.sso-app:hover{border-color:var(--accent-s);box-shadow:var(--sh-md)}
.sso-app .brand-mark{width:38px;height:38px;font-size:13px;flex:0 0 auto}
.sso-app .t{flex:1 1 auto;min-width:0}
.sso-app b{display:block;font-size:14px;font-weight:800;color:var(--brand)}
.sso-app small{display:block;font-size:11.5px;color:var(--muted);line-height:1.45}
/* The role matrix lists the ERP's modules, then Produksi's: a heading over each run. */
.pmod-app{padding:14px 16px 2px;font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--brand)}

/* ---------- report block header, light (P308) ----------
   SIBA draws it navy; twenty of them in a row drowned their own figures. Same
   structure, on the brand's palest tint. */
.cbh{background:var(--brand-50);color:var(--brand);border-bottom:1px solid var(--line)}
.cbh .rsum > span{border-left-color:var(--line)}
.cbh .rsum .neg b{color:var(--bad)}
.cbh .rwarn{background:var(--bad-bg,#FFF1F2);border-color:var(--bad-line,#FECDD3);color:var(--bad)}

/* ---------- document register (P309) ----------
   Fixed widths so the columns that decide — status, value, payment — are never
   pushed out; Nomor and the row's actions stay put when a narrow screen scrolls. */
table.grid.reg{table-layout:fixed}
table.grid.reg thead th,table.grid.reg tbody td{padding-left:8px;padding-right:8px;overflow:hidden;text-overflow:ellipsis}
table.grid.reg .idc{max-width:100%;overflow:hidden}
table.grid.reg .idc .nm{overflow:hidden;text-overflow:ellipsis}
table.grid.reg .rk,table.grid.reg .ra{position:sticky;z-index:1;background:#fff}
table.grid.reg .rk{left:0}
table.grid.reg .ra{right:0}
table.grid.reg thead th.rk,table.grid.reg thead th.ra{z-index:4}
table.grid.reg tbody tr:hover td.rk,table.grid.reg tbody tr:hover td.ra{background:#F8FAFC}
table.grid.reg .rsub.over{color:var(--bad)}
table.grid.reg tbody td{white-space:normal;line-height:1.35}
table.grid.reg tbody td .rsub,table.grid.reg tbody td .lab,table.grid.reg tbody td .mny,table.grid.reg tbody td .mono,table.grid.reg tbody td .bdg{white-space:nowrap}
table.grid.reg .idc .nm{white-space:normal}

/* An optional field left empty is not shown once the document is read (P311). */
.fld:has(> .ro.opt){display:none}

/* Report filters flow on one line and wrap (P312). */
.rfil{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 20px}
.rfil .rrow > .rl:first-child{min-width:0;flex:none}
/* A wide table keeps its subject, or its last figure, in view while it scrolls (P312). */
table.grid.kcol td:first-child,table.grid.kcol th:first-child{position:sticky;left:0;z-index:1;background:var(--surface)}
table.grid.aging td:last-child,table.grid.aging th:last-child{position:sticky;right:0;background:var(--surface);box-shadow:-1px 0 0 var(--line)}
table.grid.aging th,table.grid.aging td:first-child,table.grid.aging td:first-child *{white-space:normal}
@media(min-width:900px){.rfil .rrow{flex-wrap:nowrap}}
/* Many tabs take a second line rather than hide past the edge (P312). */
.tabs{flex-wrap:wrap}

/* ---------- aplikasi Database (P313) ----------
   A special-case page: a full-window viewer, not a list or a form. New classes
   only, for the marked additions block of globals.css; the application's tokens. */
.dbx{gap:10px;padding:10px}
.dbx mark{background:var(--accent-100);color:inherit;border-radius:3px}
/* ---- explorer */
.dbs.sub{width:272px}
.dbs-f{display:grid;gap:8px;padding:10px;border-bottom:1px solid var(--line-2)}
.dbs-r{display:flex;align-items:center;gap:8px}
.dbs-r .dtog{flex:1 1 auto}
.dbs-r .dtog button{flex:1 1 0}
.dbs-r.lbl{font-size:11px;font-weight:600;color:var(--muted)}
.dbs-r.lbl .dtog{height:28px}
.dbs-r.lbl .dtog button.on{background:var(--brand-50);color:var(--brand)}
.dbs-f .srch{flex:none;min-width:0;max-width:none}
.dbs-list{flex:1 1 auto;overflow-y:auto;padding:6px 8px 16px}
.dbs-b{display:flex;align-items:center;gap:2px;padding-bottom:2px}
.dbs-all{display:flex;align-items:center;gap:7px;height:28px;padding:0 8px;border-radius:var(--r-sm);font-size:12px;font-weight:600;color:var(--ink-2)}
.dbs-app{display:flex;align-items:baseline;justify-content:space-between;margin:10px 0 3px;padding:0 8px 5px;border-bottom:1px solid var(--line);font-size:12px;font-weight:800;color:var(--brand)}
.dbs-app span{font-size:10.5px;font-weight:500;color:var(--muted-2)}
.dbs-mod{padding:8px 8px 3px;font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2)}
.dbs-g{display:flex;align-items:center;gap:3px;height:28px;padding-right:8px;border-radius:var(--r-sm)}
.dbs-g > a{flex:1 1 auto;min-width:0;line-height:28px;font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbs-c{width:22px;height:22px;flex:0 0 auto;padding:0;border:0;background:none;color:var(--muted-2);display:grid;place-items:center;cursor:pointer}
.dbs-c .chev{display:grid;transition:transform .14s}
.dbs-c .chev.o{transform:rotate(90deg)}
.dbs-n{flex:0 0 auto;font-family:var(--f-mono);font-size:10px;color:var(--muted-2)}
.dbs-t{margin-left:11px;padding-left:8px;border-left:1px solid var(--line-2)}
.dbs-l{display:flex;align-items:center;gap:7px;height:25px;padding:0 8px;border-radius:var(--r-sm);font-size:11px;color:var(--muted)}
.dbs-l svg{flex:0 0 auto;color:var(--muted-3)}
.dbs-l span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbs-g:hover,.dbs-l:hover,.dbs-all:hover{background:var(--line-3)}
.dbs-g.on,.dbs-l.on,.dbs-all.on{background:var(--accent-50)}
.dbs-l.on,.dbs-g.on > a,.dbs-all.on{color:var(--brand);font-weight:700}
.dbs-l.on svg{color:var(--accent-d)}
/* ---- main window */
.dbm{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-sm);overflow:hidden}
.dbh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px 8px 14px;border-bottom:1px solid var(--line)}
.dbh-t{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:8px;color:var(--brand)}
.dbh-t svg{flex:0 0 auto}
.dbh-t h1{margin:0;min-width:0;font-size:14.5px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbh-t h1.mono{font-weight:600;letter-spacing:0}
.dbh-t .path{font-size:12px;color:var(--muted);white-space:nowrap}
.dbh-t .path:empty{display:none}
.dbh-t .path a:hover{color:var(--brand)}
.dbh-t .count{margin-left:4px;letter-spacing:0;text-transform:none;font-weight:600}
.dbh-a{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.dbh-a .btn{height:32px}
.dbh-a .btn.ico{width:32px}
.dbh-a .btn.on{background:var(--brand-50);color:var(--brand)}
.dbw{flex:1 1 auto;min-height:0;display:flex}
/* ---- canvas */
.dbv{position:relative;flex:1 1 auto;min-width:0;overflow:hidden;cursor:grab;touch-action:none;
  background:var(--line-3) radial-gradient(var(--line) 1px,transparent 1px) 0 0/20px 20px}
.dbv.drag{cursor:grabbing}
.dbv:focus-visible{outline-offset:-2px}
.dbv-in{position:absolute;left:0;top:0;transform-origin:0 0}
.dbv-in svg.dbv-l{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.dbv-zoom,.dbv-key{position:absolute;z-index:4;display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm)}
.dbv-zoom{right:12px;bottom:12px;gap:2px;padding:3px}
.dbv-zoom .iact{width:26px;height:26px;font-size:15px}
.dbv-zoom .pct{min-width:42px;text-align:center;font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--muted)}
.dbv-key{left:12px;top:12px;gap:6px;padding:5px 10px;font-size:11px;color:var(--muted);pointer-events:none}
.dbv-key .sw{width:14px;height:10px;border-radius:3px;border:1px solid var(--line);background:#fff}
.dbv-key .lg{display:inline-flex;align-items:center;gap:6px}
.dbv-key .lg + .lg{margin-left:7px}
.dbv-key .sw.w{background:var(--brand);border-color:var(--brand)}
.dbv-key .sw.r{background:var(--brand-100)}
.dbv-key .sw.p{background:var(--accent-100);border-color:var(--accent)}
.dbv-key .sw.o{border-style:dashed;border-color:var(--muted-2)}
.dbv-map{position:absolute;left:12px;bottom:12px;z-index:4;padding:7px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm);cursor:pointer}
.dbv-map svg{display:block;overflow:hidden}
.dbv-map rect{fill:var(--muted-3)}
.dbv-map rect.f{fill:var(--brand)}
.dbv-map rect.v{fill:none;stroke:var(--accent-d);stroke-width:1.5}
.dbt{position:absolute;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm);overflow:hidden;cursor:pointer;user-select:none}
.dbt:hover{border-color:var(--muted-2);box-shadow:var(--sh-md)}
.dbt.out{border-style:dashed;border-color:var(--muted-2);box-shadow:none}
.dbt.on{border-color:var(--accent-d);box-shadow:0 0 0 3px var(--accent-100),var(--sh-md)}
.dbt.dim{opacity:.28}
.dbt-h{height:32px;display:flex;align-items:center;gap:6px;padding:0 5px 0 10px;background:var(--brand-100);color:var(--brand)}
.dbt.w .dbt-h{background:var(--brand);color:#fff}
.dbt.p .dbt-h{background:var(--accent-100)}
.dbt.out .dbt-h{background:#fff;color:var(--ink-2)}
.dbt-h b{flex:1 1 auto;min-width:0;font-family:var(--f-mono);font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbt-h .iact{opacity:0;color:inherit}
.dbt:hover .dbt-h .iact,.dbt:focus-within .dbt-h .iact,.dbt.on .dbt-h .iact{opacity:1}
.dbt.w .dbt-h .iact:hover{background:var(--brand-d);color:#fff}
.dbt-c{height:22px;display:flex;align-items:center;gap:7px;padding:0 10px;border-top:1px solid var(--line-2);font-family:var(--f-mono);font-size:10.5px;white-space:nowrap}
.dbt-c .k{width:22px;flex:0 0 auto;font-size:9px;font-weight:600}
.dbt-c .k.pk{color:var(--warn)}
.dbt-c .k.fk{color:var(--info)}
.dbt-c .cn{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.dbt-c .ct{flex:0 1 auto;max-width:50%;overflow:hidden;text-overflow:ellipsis;color:var(--muted-2)}
.dbt-c button.ct{border:0;background:none;padding:0;font:inherit;color:var(--info);cursor:pointer;text-decoration:underline dotted}

// ------------------------------------------------------------ small readers
const ymOf = (S) => S.today.slice(0, 7).replace("-", "/");
const nextNo = (S, p) => { const k = p + ymOf(S); S.seq[k] = (S.seq[k] || 0) + 1; return `${p}/${ymOf(S)}/${String(S.seq[k]).padStart(4, "0")}`; };
const ddmmyy = (s) => s.slice(8, 10) + s.slice(5, 7) + s.slice(2, 4);
const dayNo = (S, p) => { const k = p + S.today; S.seq[k] = (S.seq[k] || 0) + 1; return `${p}_${ddmmyy(S.today)}_${String(S.seq[k]).padStart(5, "0")}`; };
const nid = (S) => ++S.nid;
const log = (S, key, what) => { (S.hist[key] = S.hist[key] || []).unshift({ at: S.today, what }); };
const soLine = (S, id) => { for (const so of S.so) for (const l of so.lines) if (l.id === id) return { so, l }; };
const orderBy = (S, id) => S.orders.find((o) => o.id === id);
const orderNo = (S, no) => S.orders.find((o) => o.no === no);
const njOf = (item) => ITEMS[item].nj;
const running = (S) => S.orders.filter((o) => !o.closed && o.rec < o.qty);

const demandedOf = (S, lineId, except) => sum(S.orders.filter((o) => o.id !== except).flatMap((o) => o.demands).filter((d) => d.line === lineId), (d) => d.qty);
const receivedOf = (S, lineId) => sum(S.orders.flatMap((o) => o.demands).filter((d) => d.line === lineId), (d) => d.rec);
/** What of a Sales Order line no FG and no Perintah covers yet: the queue. */
const queueOf = (S, l) => r2(l.qty - l.fgAlloc - demandedOf(S, l.id));
const readyToShip = (S, l) => r2(l.fgAlloc + receivedOf(S, l.id) - l.deliv);
const fgFree = (S, item) => r2((S.fg[item] || 0) - sum(S.so.flatMap((s) => s.lines).filter((l) => l.item === item), (l) => readyToShip(S, l)));
const issuedOf = (S, o, item) => sum(S.issues.filter((i) => i.po === o.id).flatMap((i) => i.lines).filter((l) => !item || l.item === item), (l) => l.g);
const spreadOf = (S, o, item) => sum(S.trans.filter((t) => t.po === o.id).flatMap((t) => t.lines).filter((l) => !item || l.item === item), (l) => l.g);
const boxesOf = (S, o) => S.boxes.filter((x) => x.po === o.id).length;
const rawStock = (S, item) => sum(S.raw.filter((x) => x.item === item), (x) => x.g);
const planIn = (o, st, item) => sum(o.stages[st].in.filter((x) => x.item === item), (x) => x.plan);
/** Stock less what higher-priority Perintah still need: a calculation, never a lock. */
const rawAvail = (S, item, prio = Infinity, self) => r2(rawStock(S, item) - sum(running(S).filter((o) => o.id !== self && o.prio < prio), (o) => Math.max(0, planIn(o, "G", item) - issuedOf(S, o, item))));
const stockAt = (S, unit, item, pred) => sum(S.b.filter((b) => b.unit === unit && b.item === item && pred(b)), (b) => b.g);
const loose = (S) => (b) => !b.po || !running(S).some((o) => o.id === b.po);
const readyFree = (S, item) => r2(stockAt(S, "UPY", item, loose(S)) - sum(running(S), (o) => o.use.ready[item] || 0));

const firstKirim = (S, o) => o.demands.map((d) => soLine(S, d.line).so.kirim).sort()[0];
const auxNeed = (o) => Object.entries(njOf(o.item).aux).map(([item, per]) => ({ item, need: per * o.qty }));

function orderStatus(S, o) {
  if (o.closed) return "Ditutup Kurang";
  if (o.rec >= o.qty) return "Selesai";
  if (["G", "P", "K"].some((k) => o.stages[k].rel)) return "Dirilis";
  return shortRaw(S, o).length ? "Menunggu Bahan" : "Siap";
}
const shortRaw = (S, o) => o.stages.G.in.map((x) => ({ item: x.item, short: r2(x.plan - issuedOf(S, o, x.item) - Math.max(0, rawAvail(S, x.item, o.prio, o.id))) })).filter((x) => x.short > EPS);
const planStatus = (S, p) => (p.status === "Berlaku" && S.orders.filter((o) => o.plan === p.id).every((o) => ["Selesai", "Ditutup Kurang"].includes(orderStatus(S, o))) && S.orders.some((o) => o.plan === p.id) ? "Selesai" : p.status);

// ------------------------------------------------------------ Rencana Produksi
function recipeOf(item) { const c = RECIPE[item]; return { bb: c.bb.map((x) => [...x]), yG: c.yG, in: c.in.map((x) => [...x]), yP: c.yP, jo: c.jo.map((x) => [...x]), out: c.out }; }
/** The chosen Sales Order lines merged per item, with what is already there. */
function planLines(S, demands, old = []) {
  const groups = [];
  for (const d of demands) {
    const { so, l } = soLine(S, d.line);
    const pra = so.status === "Pra-SO";
    let g = groups.find((x) => x.item === l.item && x.pra === pra);
    if (!g) groups.push((g = { item: l.item, pra, need: 0, demands: [] }));
    g.need = r2(g.need + d.qty);
    g.demands.push({ ...d, kirim: so.kirim });
  }
  const out = groups.map((g) => {
    g.demands.sort((a, b) => a.kirim.localeCompare(b.kirim));
    const had = old.find((x) => x.item === g.item && x.pra === g.pra);
    const fg = g.pra ? 0 : Math.min(Math.max(0, fgFree(S, g.item)), g.need);
    const run = sum(running(S).filter((o) => o.item === g.item), (o) => o.qty - o.rec);
    return { ...g, fg, run, make: r2(g.need - fg), line: ITEMS[g.item].line, recipe: had?.recipe ?? recipeOf(g.item), kirim: g.demands[0].kirim, dec: had?.dec ?? null, prio: had?.prio ?? null };
  });
  const bySlack = [...out].sort((a, b) => a.kirim.localeCompare(b.kirim));
  let n = Math.max(0, ...out.map((x) => x.prio || 0));
  for (const x of bySlack) if (x.prio == null) x.prio = ++n;
  out.sort((a, b) => a.prio - b.prio);
  out.forEach((x, i) => (x.prio = i + 1));
  // Materials, higher priority first.
  const took = { pieces: {}, ready: {}, raw: {}, aux: {} };
  for (const x of out) {
    const m = materials(S, x, took);
    Object.assign(x, { calc: m });
    if (x.make <= 0) x.dec = "FG";
    else if (x.pra) x.dec = x.dec === "Tunda" ? "Tunda" : "Beli";
    else if (!x.dec || x.dec === "FG") x.dec = m.short.length ? "Beli" : "Produksi";
    if (["Produksi", "Beli"].includes(x.dec)) claim(took, m);
  }
  return out;
}
const claim = (took, m) => { for (const k of ["pieces", "ready", "raw"]) for (const [i, g] of Object.entries(m.use[k])) took[k][i] = r2((took[k][i] || 0) + g); for (const a of m.aux) took.aux[a.item] = (took.aux[a.item] || 0) + a.need; };
/** Backwards from the box to the raw material (plan §5). */
function materials(S, x, took = { pieces: {}, ready: {}, raw: {}, aux: {} }) {
  const nj = njOf(x.item), c = x.recipe, use = { pieces: {}, ready: {}, raw: {} };
  const packG = r2(x.make * nj.g);
  const pcs = Math.min(packG, Math.max(0, r2(piecesFree(S, c.out) - (took.pieces[c.out] || 0))));
  if (pcs) use.pieces[c.out] = pcs;
  const up = (x) => Math.ceil(x - 1e-6);
  const outP = r2(packG - pcs), inP = r2(outP / (c.yP / 100));
  const pIn = c.in.map(([item, pct]) => ({ item, plan: up((inP * pct) / 100) })).filter((y) => y.plan > 0);
  let gOutT = 0;
  const gOut = pIn.map((y) => { const free = Math.min(y.plan, Math.max(0, r2(readyFree(S, y.item) - (took.ready[y.item] || 0)))); if (free) use.ready[y.item] = free; const plan = r2(y.plan - free); gOutT = r2(gOutT + plan); return { item: y.item, plan }; }).filter((y) => y.plan > 0);
  const bbT = r2(gOutT / (c.yG / 100));
  const gIn = c.bb.map(([item, pct]) => ({ item, plan: up((bbT * pct) / 100) })).filter((y) => y.plan > 0);
  const raw = gIn.map((y) => { const free = Math.max(0, r2(rawAvail(S, y.item) - (took.raw[y.item] || 0))); use.raw[y.item] = Math.min(free, y.plan); return { item: y.item, need: y.plan, have: Math.min(free, y.plan), short: r2(Math.max(0, y.plan - free)) }; });

}
function savePlan(S, p) {
  if (!p.demands.length) refuse("Pilih minimal satu baris Sales Order.");
  for (const d of p.demands) {
    const { so, l } = soLine(S, d.line);
    if (!(d.qty > 0)) refuse(`Qty ${so.no} belum diisi.`);
    if (d.qty > queueOf(S, l) + EPS) refuse(`${so.no} ${l.item}: diisi ${d.qty}, sisa yang belum direncanakan ${queueOf(S, l)} kotak.`);
  }
  p.lines = planLines(S, p.demands, p.lines);
  if (!p.id) { p.id = nid(S); p.no = nextNo(S, "RP"); p.status = "Draft"; S.plans.unshift(p); log(S, p.no, "Dibuat"); } else log(S, p.no, "Diubah");

}
function submitPlan(S, p) { savePlan(S, p); p.status = "Diajukan"; log(S, p.no, "Diajukan"); }
function cancelPlan(S, p, why) { if (!why) refuse("Alasan wajib diisi."); p.status = p.status === "Diajukan" ? "Ditolak" : "Dibatalkan"; p.reason = why; log(S, p.no, p.status); }
/** Approval: Perintah are born, what is short becomes Purchase Request. */
function approvePlan(S, p) {
  if (p.status !== "Diajukan") refuse("Hanya Rencana yang Diajukan yang bisa disetujui.");
  const lines = planLines(S, p.demands, p.lines);
  p.lines = lines;
  const made = [];
  for (const x of lines) {
    if (x.dec === "Tunda") continue;
    let fg = x.fg;
    const rest = [];
    for (const d of x.demands) { const take = Math.min(fg, d.qty); fg = r2(fg - take); if (take) soLine(S, d.line).l.fgAlloc += take; if (d.qty - take > EPS) rest.push({ line: d.line, qty: r2(d.qty - take), rec: 0 }); }
    const buy = x.calc.short;
    let o = null;
    if (x.make > 0 && !x.pra) {
      o = { id: nid(S), no: nextNo(S, "PP"), plan: p.id, date: S.today, item: x.item, line: x.line, qty: x.make, rec: 0, prio: Math.max(0, ...S.orders.map((q) => q.prio)) + 1, demands: rest, recipe: x.recipe, use: { pieces: { ...x.calc.use.pieces }, ready: { ...x.calc.use.ready } }, closed: null, add: [],
        stages: { G: { rel: false, in: x.calc.gIn, out: x.calc.gOut }, P: { rel: false, in: x.calc.pIn, out: x.calc.pOut, jo: x.calc.jo }, K: { rel: false } } };
      S.orders.push(o);
      made.push(o);
      log(S, o.no, `Terbit dari ${p.no}`);
    }
    if (x.dec === "Beli" && buy.length) {
      const pr = { id: nid(S), no: nextNo(S, "PR"), date: S.today, need: windows(x.kirim).G[0] < S.today ? workDays(S.today, 3) : windows(x.kirim).G[0], plan: p.id, po: o?.id ?? null, status: "Open", lines: buy.map((y) => ({ item: y.item, g: Math.ceil(y.short), got: 0 })) };
      S.prs.unshift(pr);
      log(S, pr.no, `Terbit dari ${p.no}`);

  log(S, p.no, "Disetujui");

}
/** What a purchase brings in (the Receipt Note, summarised). */
function receivePr(S, pr) {
  if (pr.status !== "Open") refuse("Purchase Request sudah selesai.");
  for (const l of pr.lines) { l.got = l.g; if (ITEMS[l.item].aux) S.aux[l.item] += l.g; else { S.seq.STK = (S.seq.STK || 3) + 1; S.raw.push({ no: `STK-${String(S.seq.STK).padStart(4, "0")}`, item: l.item, g: l.g }); } }
  pr.status = "Ditutup";
  log(S, pr.no, "Ditutup, seluruhnya diterima");
}
function movePrio(S, o, dir) {
  const list = running(S).sort((a, b) => a.prio - b.prio), i = list.indexOf(o), other = list[i + dir];
  if (!other) return;
  [o.prio, other.prio] = [other.prio, o.prio];
  log(S, o.no, `Prioritas diubah, kini di ${dir < 0 ? "atas" : "bawah"} ${other.no}`);
}

// ------------------------------------------------------------ Perintah Produksi
const STAGE = { G: "Grading", P: "Proses", K: "Packing" };
function stageState(S, o, k) {
  if (k === "G" && !o.stages.G.in.length) return "Tidak perlu";
  if (k === "P" && !o.stages.P.in.length) return "Tidak perlu";
  if (!o.stages[k].rel) return "Belum dirilis";
  const t = k === "G" ? [sum(o.stages.G.in, (x) => x.plan), issuedOf(S, o)] : k === "P" ? [sum(o.stages.P.in, (x) => x.plan), spreadOf(S, o)] : [o.qty, boxesOf(S, o)];
  return t[1] >= t[0] - EPS ? "Selesai" : "Dirilis";
}
function releaseStage(S, o, k) {
  const st = orderStatus(S, o);
  if (["Selesai", "Ditutup Kurang"].includes(st)) refuse(`${o.no} sudah ${st}.`);

function Guide() {

  const item = (s, k) => html`<li key=${k} className=${s.done() ? "ok" : k === i ? "now" : ""}><button onClick=${() => { const x = typeof s.to === "function" ? s.to() : s.to; x.includes("undefined") ? pushToast("Belum bisa", "Selesaikan langkah sebelumnya dulu.") : go(x); setOpen(false); }}>${s.t}</button></li>`;

// ================================================================ router
function route(r) {

  if (r === "rencana-baru") return html`<${PlanForm} key="new" />`;
  if ((x = m(/^rencana-(\d+)-ubah$/))) return html`<${PlanForm} key=${r} id=${+x[1]} />`;
  if ((x = m(/^rencana-(\d+)$/))) return html`<${PlanView} key=${r} id=${+x[1]} />`;
  if (r === "perintah") return html`<${OrderList} />`;
  if ((x = m(/^perintah-(\d+)$/))) return html`<${OrderView} key=${r} id=${+x[1]} />`;
  if (r === "perintah-p") return html`<${OrderList} prd />`;
  if ((x = m(/^perintah-p-(\d+)$/))) return html`<${OrderView} key=${r} id=${+x[1]} prd />`;
  if (r === "planning") return html`<${Planning} />`;
  if (r === "planning-p") return html`<${Planning} prd />`;
  if (r === "realisasi") return html`<${Recap} />`;
  if (r === "so") return html`<${SoList} />`;
  if ((x = m(/^so-(\d+)$/))) return html`<${SoView} key=${r} id=${+x[1]} />`;
  if (r === "pr") return html`<${PrList} />`;
  if ((x = m(/^pr-(\d+)$/))) return html`<${PrView} key=${r} id=${+x[1]} />`;
  if (r === "issue") return html`<${IssueList} />`;
  if (r === "issue-baru") return html`<${IssueForm} />`;
  if ((x = m(/^issue-(\d+)$/))) return html`<${IssueView} key=${r} id=${+x[1]} />`;
  if (r === "receipt") return html`<${ReceiptList} />`;
  if ((x = m(/^receipt-(\d+)$/))) return html`<${ReceiptView} key=${r} id=${+x[1]} />`;
  if (r === "ws") return html`<${Workspace} />`;
  if ((x = m(/^ws-([A-Z0-9]+)$/))) return html`<${UnitPage} key=${r} u=${x[1]} />`;
  if ((x = m(/^grading-(\d+)$/))) return html`<${GradingForm} key=${r} id=${+x[1]} />`;

}
function App() {
  const [, tick] = useState(0), [r, setR] = useState(location.hash.slice(1)), [toasts, setToasts] = useState([]);
  bump = () => tick((n) => n + 1);
  pushToast = (title, body, kind = "") => { const id = Math.random(); setToasts((t) => [...t.slice(-2), { id, title, body, kind }]); setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 5200); };
  useEffect(() => { const f = () => { setR(location.hash.slice(1)); document.getElementById("content")?.scrollTo(0, 0); }; addEventListener("hashchange", f); return () => removeEventListener("hashchange", f); }, []);
  useEffect(() => { if (r === "realisasi" && !S.seen && O1()?.rec >= O1()?.qty) { S.seen = 1; persist(); bump(); } }, [r]);
  return html`<div className="simroot"><${Shell} route=${r || "rencana"}>${route(r)}<//><div id="toasts" role="status" aria-live="polite">${toasts.map((t) => html`<div key=${t.id} className=${"toast " + t.kind}><div className="t"><b>${t.title}</b>${t.body ? html`<span>${t.body}</span>` : null}</div><button className="x" aria-label="Tutup" onClick=${() => setToasts((x) => x.filter((y) => y.id !== t.id))}>×</button></div>`)}</div><${Guide} /></div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
